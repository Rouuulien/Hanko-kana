<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3402a"><meta name="description" content="Apprends les hiragana et katakana avec Daru : leçons, révisions espacées, mots et mode Rafale.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hanko"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hanko · kana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body><div id="app"></div>
<script type="module">
import{shuffle,pick,esc,H2K,K2H}from'./src/util.js';
import{ITEMS,UNITS,LES,SL,UN,unitItems,TOTAL}from'./src/data/kana.js';
import{NOTE_P,NOTE_S,fr}from'./src/data/notes.js';
import{WORDS}from'./src/data/words.js';
import{KEY,fresh,S,replaceState,loadLocal,saveLocal}from'./src/core/state.js';
import{merge}from'./src/core/merge.js';
import{IV,grade,dueList,nextDue}from'./src/core/srs.js';
import{ld,streak,todayXp,unlocked,testOpen,nextLesson,allDone}from'./src/core/progress.js';
import{KS,ksP,loadKS,canDraw,drawOK}from'./src/draw/strokes.js';
import{judgeDraw}from'./src/draw/recognize.js';
import{modelSVG,aidSVG}from'./src/draw/svg.js';
import{ui}from'./src/ui/app-state.js';
import{SPK,GEAR,FLAME,COIN}from'./src/ui/icons.js';
import{daru,mascot}from'./src/ui/daru.js';
import{sfx,muteBtn}from'./src/ui/sounds.js';
import{bindUI,cloud,save,cloudInit,sbLogin,sbSetPw,sbDelete,cloudText,paintCloud}from'./src/sync/cloud.js';
const app=document.getElementById('app');


const canRead=(w,extra)=>w.t.every(c=>S.learned[c]||(extra&&extra.has(c)));
const wordsWith=c=>WORDS.filter(w=>w.t.includes(c));
const wordHTML=w=>`<span class="w" lang="ja">${w.j}</span> · ${w.r} · « ${w.f} »`;

/* ---------- état ---------- */
loadLocal();
/* ---------- synchronisation : voir src/sync/cloud.js ---------- */
/* état de l’interface : voir src/ui/app-state.js */
function accountV(){if(cloud.mode!=='sb')return'';const msg=cloud.msg?`<p class="amsg" role="status">${esc(cloud.msg)}</p>`:'';
  if(cloud.st==='off')return`<h2>Compte</h2><p class="mut" style="margin:0">Connexion impossible hors ligne. Reviens quand tu as du réseau pour créer ton compte ou te connecter.</p>`;
  if(cloud.uid){const pwForm=`<form id="setpw" class="lg"><input id="npw" class="rin" type="password" autocomplete="new-password" minlength="8" placeholder="Nouveau mot de passe (8 caractères min.)" aria-label="Nouveau mot de passe"><button class="btn ac">Enregistrer le mot de passe</button></form>`;
    return`<h2>Compte</h2><p style="margin:0">Connecté avec <b>${esc(cloud.email)}</b>.</p>
    ${cloud.recovery?`<p style="margin:0"><b>Choisis ton nouveau mot de passe :</b></p>${pwForm}`:cloud.pwOpen?pwForm:`<button class="link" style="justify-self:start" data-act="pwopen">Définir ou changer mon mot de passe</button>`}${msg}
    <div class="acts" style="justify-content:flex-start;margin:0"><button class="btn gh" data-act="logout">Se déconnecter</button><button class="btn danger" data-act="delacc">${ui.armedDel?'Confirmer : tout supprimer':'Supprimer mon compte'}</button></div>
    <p class="mut" style="margin:0">La suppression efface définitivement ton compte et ta progression en ligne.</p>`}
  const tab=cloud.tab||'pw';
  const body=tab==='pw'
    ?`<input id="lmail" class="rin" type="email" autocomplete="email" placeholder="ton@email.fr" required aria-label="Adresse e-mail" value="${esc(cloud.email)}">
      <input id="lpw" class="rin" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe">
      <div class="acts" style="justify-content:flex-start;margin:0"><button class="btn ac" data-sub="login">Se connecter</button><button class="btn gh" data-sub="signup">Créer un compte</button></div>
      <button class="link" style="justify-self:start" data-sub="forgot">Mot de passe oublié ?</button>`
    :cloud.step==='code'
      ?`<p style="margin:0">E-mail envoyé à <b>${esc(cloud.email)}</b>.</p><input id="lcode" class="rin" inputmode="numeric" autocomplete="one-time-code" placeholder="Code reçu par e-mail" maxlength="10" aria-label="Code reçu par e-mail"><button class="btn ac">Valider le code</button><button type="button" class="link" data-act="lreset">Changer d’adresse e-mail</button>`
      :`<input id="lmail" class="rin" type="email" autocomplete="email" placeholder="ton@email.fr" required aria-label="Adresse e-mail" value="${esc(cloud.email)}"><button class="btn ac">Recevoir un lien de connexion</button>`;
  return`<h2>Compte</h2><p class="mut" style="margin:0">Crée un compte gratuit pour sauvegarder ta progression en ligne et la retrouver sur tous tes appareils.</p>
    <div class="chips" role="tablist"><button data-act="atab" data-id="pw" aria-pressed="${tab==='pw'}">E-mail et mot de passe</button><button data-act="atab" data-id="code" aria-pressed="${tab==='code'}">Lien par e-mail</button></div>
    <form id="login" class="lg">${body}${msg}</form>
    <p class="mut" style="margin:0;font-size:14px">En créant un compte, tu acceptes la <a href="confidentialite.html">politique de confidentialité</a>.</p>`}
function addXp(n){const t=ld();if(S.today!==t){S.today=t;S.todayXp=0}S.todayXp+=n;S.xp+=n;if(S.last!==t){S.streak=S.last===ld(-1)?S.streak+1:1;S.last=t}save()}

/* ---------- voix ---------- */
let tts=false,jv=null;
function loadV(){try{jv=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null;tts=!!jv}catch(e){tts=false}}
if('speechSynthesis'in window){loadV();try{speechSynthesis.onvoiceschanged=()=>{const was=tts;loadV();if(was!==tts&&ui.view==='home')render()}}catch(e){}}
function say(t){if(!tts)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.voice=jv;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const earOK=()=>tts&&S.ear!==false;

/* ---------- sessions ---------- */
/* état de l’interface : voir src/ui/app-state.js */
function pickType(box,c){if(c&&box>=2&&drawOK()&&canDraw(c)&&KS[c]&&Math.random()<.18)return'draw';const r=Math.random(),e=earOK()?'ear':'k2r';if(box>=3)return r<.55?'type':r<.8?'r2k':e;return r<.45?'k2r':r<.85?'r2k':e}
function opts(c){const it=ITEMS[c],P=Object.values(ITEMS).filter(x=>x.s===it.s&&x.c!==c&&x.r!==it.r);
  const pref=P.filter(x=>ui.ses.set.has(x.c)||S.learned[x.c]);const src=shuffle(pref.length>=3?pref:P);
  const seen=new Set(),out=[];for(const x of src){if(seen.has(x.r))continue;seen.add(x.r);out.push(x.c);if(out.length===3)break}
  return shuffle([c,...out])}
const sample=(a,n)=>shuffle(a).slice(0,n);
function initQuiz(queue){Object.assign(ui.ses,{queue,i:0,ok:0,n:0,xp:0,combo:0,best:0,miss:new Set(),graded:new Set(),ans:null});ui.view='quiz'}
function startLesson(id){const L=LES[id];ui.ses={kind:'lesson',id,items:L.items,set:new Set(L.items),ci:0,cw:{}};ui.view='cards';render()}
function lessonQueue(){const N=ui.ses.items,s=ITEMS[N[0]].s,cap=Math.min(N.length,6);
  const rev=sample(Object.keys(S.learned).filter(c=>!ui.ses.set.has(c)&&ITEMS[c].s===s),3);
  const p1=shuffle(N).map(c=>({c,type:'k2r'}));
  const p2=sample(N,N.length>6?cap:N.length).map(c=>({c,type:earOK()&&Math.random()<.35?'ear':'r2k'}));
  const p3=shuffle([...sample(N,cap).map(c=>({c,type:'type'})),...rev.map(c=>({c,type:pickType(S.learned[c].box,c),rev:true}))]);
  const p4=drawOK()?sample(N.filter(c=>canDraw(c)&&KS[c]),2).map(c=>({c,type:'draw'})):[];
  return[...p1,...p2,...p3,...p4]}
function startTest(uid){const u=UN[uid],all=unitItems(u);ui.ses={kind:'test',id:uid,set:new Set(all)};initQuiz(sample(all,15).map(c=>({c,type:pickType(S.learned[c]?S.learned[c].box:2,c)})));render()}
function startReview(practice){const cs=practice?sample(Object.keys(S.learned),15):dueList().slice(0,20);if(!cs.length)return;ui.ses={kind:practice?'practice':'review',set:new Set(cs)};initQuiz(shuffle(cs).map(c=>({c,type:pickType(S.learned[c].box,c)})));render()}
const cur=()=>ui.ses.queue[ui.ses.i];
function settle(ok,extra){const Q=cur(),it=ITEMS[Q.c];
  if(ok){ui.ses.combo++;ui.ses.best=Math.max(ui.ses.best,ui.ses.combo)}else ui.ses.combo=0;
  let msg=ok?pick(['Bien vu !','Exact !','Parfait.','Oui, c’est ça !','Sugoi !']):'Pas tout à fait.';
  if(ok&&ui.ses.combo>=3&&ui.ses.combo%3===0)msg=`Série de ${ui.ses.combo} ! Daru est fier.`;
  let tip='';if(!ok){const h=K2H(Q.c);tip=NOTE_S[Q.c]||NOTE_P[h]||(()=>{const w=wordsWith(Q.c).filter(w=>canRead(w,ui.ses.set));return w.length?`Retiens-le avec ${wordHTML(pick(w))}`:''})()}
  ui.ses.ans=Object.assign({ok,msg,tip},extra);sfx(!ok?'bad':ui.ses.combo>=3&&ui.ses.combo%3===0?'combo':'ok');
  if(!Q.retry){ui.ses.n++;if(ok){ui.ses.ok++;ui.ses.xp+=2}else ui.ses.miss.add(Q.c);
    const g=ui.ses.kind==='review'||ui.ses.kind==='test'||(ui.ses.kind==='lesson'&&Q.rev);if(g&&!ui.ses.graded.has(Q.c)){ui.ses.graded.add(Q.c);grade(Q.c,ok);save()}}
  if(!ok)ui.ses.queue.push({c:Q.c,type:Q.type==='type'?'k2r':Q.type,retry:true});render()}
function answer(i){if(ui.ses.ans)return;const Q=cur();settle(Q.o[i]===Q.c,{i})}
function answerTyped(v){if(ui.ses.ans)return;const it=ITEMS[cur().c],n=v.trim().toLowerCase().replace(/\s+/g,'');if(!n)return;settle(n===it.r||it.al.includes(n),{v})}
function next(){if(!ui.ses||!ui.ses.ans)return;ui.ses.ans=null;ui.ses.i++;if(ui.ses.i>=ui.ses.queue.length)return finish();render()}
function finish(){const sc=ui.ses.n?ui.ses.ok/ui.ses.n:1;let pass=true;
  if(ui.ses.kind==='lesson'){const before=new Set(WORDS.filter(w=>canRead(w)).map(w=>w.j));S.done[ui.ses.id]=true;for(const c of ui.ses.items)if(!S.learned[c])S.learned[c]={box:1,due:Date.now()+IV[1]};ui.ses.xp+=10;ui.ses.newWords=WORDS.filter(w=>!before.has(w.j)&&canRead(w))}
  if(ui.ses.kind==='test'){pass=sc>=.8;S.tests[ui.ses.id]=Math.max(S.tests[ui.ses.id]||0,Math.round(sc*100));if(pass)ui.ses.xp+=20}
  ui.ses.score=sc;ui.ses.pass=pass;sfx(pass?'done':'bad');addXp(ui.ses.xp);ui.view='res';ui.homeTip=null;render()}

/* ---------- Zone de dessin et aides (le tracé, sa reconnaissance et ses SVG sont dans src/draw/) ---------- */
const BASE_AID={1:2,2:1,3:0};
function aidCtx(){if(ui.view==='cards'&&ui.ses&&ui.ses.tr&&!ui.ses.tdone)return{c:LES[ui.ses.id].items[ui.ses.ci],aid:2};
  if(ui.view==='quiz'&&ui.ses&&!ui.ses.ans){const Q=cur();if(Q&&Q.type==='draw')return{c:Q.c,aid:Q.h||0}}
  if(ui.view==='brush'&&ui.bs&&ui.bs.state!=='done')return{c:ui.bs.q[ui.bs.u],aid:Math.max(BASE_AID[S.bl||2],ui.bs.h||0)};return null}
/* état de l’interface : voir src/ui/app-state.js */
function refreshAid(){if(!ui.PAD)return;const el=document.querySelector('#'+ui.PAD.id+' .phint');if(!el)return;const a=aidCtx();
  el.innerHTML=a&&!ui.PAD.locked?aidSVG(a.c,a.aid,ui.PAD.strokes.length,ui.aidAnim):'';ui.aidAnim=false}
const hintBtn=(act,h,base)=>{const cur=Math.max(base,h||0);return cur>=3?'':`<button class="btn gh sm hintb" data-act="${act}">Indice${cur>base?` (${cur-base}/${3-base})`:''}</button>`};
/* état de l’interface : voir src/ui/app-state.js */
const padHTML=(id,guide)=>`<div class="pad" id="${id}">${guide&&KS?`<div class="pguide">${modelSVG(guide,{anim:false,nums:false,cls:'ghost'})}</div>`:''}<div class="phint"></div><canvas aria-label="Zone de dessin"></canvas><div class="pover"></div></div>`;
const padTools=(chk,extra)=>`<div class="ptools"><button class="btn gh sm" data-act="pundo">↶ Annuler</button><button class="btn gh sm" data-act="pclear">Effacer</button>${chk?`<button class="btn ac sm" data-act="${chk}">Valider</button>`:''}${extra||''}</div>`;
function mountPad(id){const box=document.getElementById(id);if(!box)return null;const cv=box.querySelector('canvas'),ctx=cv.getContext('2d');
  const keep=ui.PAD&&ui.PAD.id===id&&ui.PAD.key===box.dataset.key;const st=keep?ui.PAD.strokes:[];let cur=null,W=0;
  const P={id,key:box.dataset.key,strokes:st,locked:keep?ui.PAD.locked:false,fade:keep?ui.PAD.fade:false,onStroke:null};
  function redraw(){const w=box.clientWidth,h=box.clientHeight;ctx.clearRect(0,0,w,h);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,w/30);ctx.strokeStyle=getComputedStyle(box).color;ctx.globalAlpha=P.fade?.3:1;
    for(const s of cur?st.concat([cur]):st){ctx.beginPath();s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.length===1)ctx.lineTo(s[0][0]+.1,s[0][1]+.1);ctx.stroke()}ctx.globalAlpha=1}
  function size(){const d=window.devicePixelRatio||1,w=box.clientWidth,h=box.clientHeight;if(!w)return;if(W&&W!==w){const k=w/W;for(const s of st)for(const q of s){q[0]*=k;q[1]*=k}}W=w;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);redraw()}
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{if(P.locked)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}cur=[pt(e)];redraw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();for(const x of(e.getCoalescedEvents?e.getCoalescedEvents():[e]))cur.push(pt(x));redraw()});
  const end=()=>{if(!cur)return;if(cur.length>1||st.length<12)st.push(cur);cur=null;redraw();if(P.onStroke)P.onStroke();refreshAid()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);cv.addEventListener('lostpointercapture',end);
  Object.assign(P,{redraw,undo(){if(!P.locked){st.pop();redraw();refreshAid()}},clear(){if(!P.locked){st.length=0;redraw();refreshAid()}},over(h){box.querySelector('.pover').innerHTML=h},reset(){P.locked=false;P.fade=false;st.length=0;P.over('');redraw()}});
  try{new ResizeObserver(size).observe(box)}catch(e){}size();ui.PAD=P;refreshAid();return P}
const strokesOf=P=>P?P.strokes.filter(s=>s.length>1||P.strokes.length<3):[];

/* ---------- Mode Pinceau : on entend/lit le son, on dessine ---------- */
/* état de l’interface : voir src/ui/app-state.js */
function brushPool(sc){return Object.keys(S.learned).filter(c=>canDraw(c)&&KS&&KS[c]&&(sc==='b'||ITEMS[c].s===sc))}
const bkey=()=>'brush-'+(S.bsc||'h')+'-'+(S.bn||10)+'-L'+(S.bl||2);
const LVL={1:['Calque','Le kana est en filigrane et le prochain trait s’anime : tu n’as qu’à le suivre.'],2:['Guidé','Seul le point de départ numéroté du prochain trait est affiché.'],3:['Libre','Aucune aide, comme à l’examen. Le bouton Indice reste là en cas de besoin.']};
function brushSetupV(){if(!KS)return`<div class="rset">${mascot('idle','Je prépare les pinceaux… (il faut une connexion la première fois)',64)}</div>`;
  const pool=brushPool(S.bsc||'h'),n=+(S.bn||10),size=n?Math.min(n,pool.length):pool.length,b=S.best[bkey()];
  const grp=(lab,k,opts,def)=>`<div class="og"><span>${lab}</span><div class="chips">${opts.map(([v,t])=>`<button data-act="rset" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k]??def)===String(v)}">${t}</button>`).join('')}</div></div>`;
  const ok=pool.length>=3;
  return`<div class="rset">${mascot('idle',ok?`Je te donne un son, tu dessines le kana au doigt. Commence en Calque, puis passe en Guidé et en Libre quand tu te sens prêt. <b>${size} kana</b> parmi ceux que tu as appris. Soigne l’ordre des traits : je le vérifie !`:'Il me faut au moins 3 kana appris dans cette écriture. Fais une leçon et reviens !',64)}
  ${grp('Niveau','bl',[[1,'Calque'],[2,'Guidé'],[3,'Libre']],2)}<p class="lvl">${LVL[S.bl||2][1]}</p>${grp('Écriture','bsc',[['h','Hiragana'],['k','Katakana'],['b','Les deux']],'h')}${grp('Nombre de kana','bn',[[10,'10'],[20,'20'],[0,'Tous']],10)}
  <p class="rbest">${b?`Ton record : <b>${fmtT(b.ms)}</b> pour ${b.n} kana, ${b.acc} % justes du premier coup`:'Pas encore de record pour ces réglages.'}</p>
  <button class="btn ac" data-act="bstart" ${ok?'':'disabled'}>Prendre le pinceau</button></div>`}
function startBrush(){const pool=brushPool(S.bsc||'h');if(pool.length<3)return;const n=+(S.bn||10);
  ui.bs={q:shuffle(pool).slice(0,n||pool.length),u:0,start:0,ok:0,err:0,miss:new Set(),res:[],state:'draw',r:null,tid:0,h:0,hinted:new Set(),lvl:+(S.bl||2)};ui.PAD=null;ui.view='brush';render()}
function stopBrush(){if(ui.bs&&ui.bs.tid){clearInterval(ui.bs.tid);ui.bs.tid=0}}
function bClock(){return fmtT(ui.bs.start?Date.now()-ui.bs.start:0)}
function brushV(){const c=ui.bs.q[ui.bs.u],it=ITEMS[c],R=ui.bs.r,left=ui.bs.q.length-ui.bs.u;
  const fb=ui.bs.state==='done'?`<div class="bfb ${R.ok?'ok':'bad'}"><b>${R.ok?pick(['Joli trait !','Bien tracé !','Parfait.']):'Pas tout à fait.'}</b><span>${R.tip||''}</span></div>`:'';
  const acts=ui.bs.state!=='done'?padTools('bcheck',hintBtn('bhint',ui.bs.h,BASE_AID[ui.bs.lvl])+`<button class="link" data-act="bskip">Je ne sais pas</button>`)
    :R.ok?`<div class="ptools"><button class="btn ac" data-act="bnext" id="bnb">Suivant</button></div>`
    :`<div class="ptools"><button class="btn gh sm" data-act="bretry">Réessayer</button><button class="btn ac sm" data-act="bnext" id="bnb">Suivant</button>${R.self?'':`<button class="link" data-act="bself">J’avais juste</button>`}</div>`;
  return`<div class="rz bz"><div class="rz-top"><button class="x" data-act="bquit" aria-label="Quitter">×</button><span class="rz-tag">Pinceau · ${LVL[ui.bs.lvl][0]} · ${left} restant${left>1?'s':''}</span>${muteBtn()}${daru(R?R.ok?'happy':'oops':'idle',36,allDone())}</div>
  <div class="bstage"><div class="bprompt"><span class="bro">${it.r}</span>${ui.bs.lvl<3||ui.bs.h>=1?`<span class="bcount">${KS[c].d.length} trait${KS[c].d.length>1?'s':''}</span>`:''}${tts?`<button class="say" data-act="say" data-t="${c}" aria-label="Écouter">${SPK}</button>`:''}</div>
  ${padHTML('bp',null).replace('class="pad"',`class="pad dark" data-key="${ui.bs.u}"`)}${fb}${acts}</div>
  <div class="rbar"><span class="t" id="bt">${bClock()}</span><div class="typed bscore"><span>${ui.bs.ok}</span>&nbsp;juste${ui.bs.ok>1?'s':''}</div><span class="c">${ui.bs.u+1}<small>/${ui.bs.q.length}</small></span></div></div>`}
function bCheck(){const P=ui.PAD,c=ui.bs.q[ui.bs.u],st=strokesOf(P);if(!st.length)return;const r=judgeDraw(st,c);ui.bs.r=r;ui.bs.state='done';P.locked=true;P.fade=true;
  if(ui.bs.res[ui.bs.u]==null){ui.bs.res[ui.bs.u]=r.ok;if(r.ok){ui.bs.ok++;if(ui.bs.h>BASE_AID[ui.bs.lvl])ui.bs.hinted.add(c)}else{ui.bs.err++;ui.bs.miss.add(c)}}
  sfx(r.ok?'card':'bad');render();if(r.ok)setTimeout(()=>{if(ui.view==='brush'&&ui.bs&&ui.bs.state==='done'&&ui.bs.q[ui.bs.u]===c)bNext()},1400)}
function bNext(){ui.bs.u++;ui.bs.state='draw';ui.bs.r=null;ui.bs.h=0;ui.PAD=null;if(ui.bs.u>=ui.bs.q.length)return endBrush();render()}
function endBrush(){stopBrush();const ms=ui.bs.start?Date.now()-ui.bs.start:0,n=ui.bs.q.length;ui.bs.ms=ms;ui.bs.acc=Math.round(ui.bs.ok/n*100);const k=bkey(),b=S.best[k];
  ui.bs.record=ui.bs.ok>0&&(!b||b.n!==n||ms<b.ms||(ms===b.ms&&ui.bs.acc>b.acc));if(ui.bs.record)S.best[k]={ms,n,acc:ui.bs.acc};ui.bs.prev=b;if(ui.bs.ok)sfx('done');addXp(ui.bs.ok*2-ui.bs.hinted.size+(ui.bs.lvl-1)*ui.bs.ok);ui.view='brushres';render()}

const unitK=c=>({j:c,t:[{c,r:ITEMS[c].r,al:ITEMS[c].al}]});
function unitW(w){const ch=[...w.j],t=[];for(let i=0;i<ch.length;){const two=ch[i]+(ch[i+1]||'');if(ITEMS[two]){t.push({c:two,r:ITEMS[two].r,al:ITEMS[two].al});i+=2;continue}const c=ch[i];
  if(c==='ー'){const v=((t[t.length-1]||{r:''}).r.match(/[aiueo]$/)||['-'])[0];t.push({c,r:v,al:['-']})}else t.push({c,r:ITEMS[c].r,al:ITEMS[c].al});i++}return{j:w.j,f:w.f,t}}
function rushPool(sc,ct){if(ct==='words')return WORDS.filter(w=>canRead(w)&&(sc==='b'||w.s===sc)).map(unitW);return Object.keys(S.learned).filter(c=>sc==='b'||ITEMS[c].s===sc).map(unitK)}
const rkey=()=>(S.rfmt||'deck')+'-'+S.rsc+'-'+S.rct+(S.rfmt==='time'?'-'+S.rdu:'');
const fmtT=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
/* état de l’interface : voir src/ui/app-state.js */
function rushSetupV(){const pool=rushPool(S.rsc,S.rct),b=S.best[rkey()],deck=S.rfmt!=='time',kind=S.rct==='words'?'mots':'kana';
  const grp=(lab,k,opts)=>`<div class="og"><span>${lab}</span><div class="chips">${opts.map(([v,t])=>`<button data-act="rset" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k]||'deck')===String(v)}">${t}</button>`).join('')}</div></div>`;
  const ok=pool.length>=5;
  const talk=!ok?`Il me faut au moins 5 ${S.rct==='words'?'mots lisibles':'kana appris'} dans cette sélection. Fais encore une leçon et reviens !`
    :deck?`Ton paquet de <b>${pool.length} ${kind}</b> défile une fois. Tape la lecture, sans valider : le chrono s’arrête à la dernière carte.`
    :`Les ${kind} défilent sans fin pendant ${S.rdu} s. Tape-en le plus possible !`;
  const best=!b?'Pas encore de record pour ces réglages.':deck?`Ton record : <b>${fmtT(b.ms)}</b> pour ${b.n} cartes, ${b.acc} % de précision`:`Ton record : <b>${b.kpm} kana/min</b>, ${b.acc} % de précision`;
  return`<div class="rset">${mascot('idle',talk,64)}
  ${grp('Format','rfmt',[['deck','Paquet complet'],['time','Contre la montre']])}${grp('Écriture','rsc',[['h','Hiragana'],['k','Katakana'],['b','Les deux']])}${grp('Contenu','rct',[['kana','Kana seuls'],['words','Mots']])}${deck?'':grp('Durée','rdu',[[30,'30 s'],[60,'1 min'],[120,'2 min']])}
  <p class="rbest">${best}</p><button class="btn ac" data-act="rstart" ${ok?'':'disabled'}>Lancer la rafale</button></div>`}
function rFill(){while(ui.rs.q.length<ui.rs.u+10){let n,g=0;do{n=pick(ui.rs.pool)}while(ui.rs.q.length&&n.j===ui.rs.q[ui.rs.q.length-1].j&&g++<5);ui.rs.q.push(n)}}
function startRush(){const pool=rushPool(S.rsc,S.rct);if(pool.length<5)return;const fmt=S.rfmt==='time'?'time':'deck';
  ui.rs={fmt,pool,dur:+S.rdu,q:fmt==='deck'?shuffle(pool):[],u:0,k:0,typed:'',res:[],wrong:false,start:0,ok:0,err:0,miss:new Map(),afterN:false,tid:0,ck:'',ckU:-1};
  if(fmt==='time')rFill();ui.view='rush';render()}
function stopRush(){if(ui.rs&&ui.rs.tid){clearInterval(ui.rs.tid);ui.rs.tid=0}}
const curTok=()=>ui.rs.q[ui.rs.u].t[ui.rs.k];
function rClock(){if(!ui.rs.start)return fmtT(ui.rs.fmt==='time'?ui.rs.dur*1000:0);const e=Date.now()-ui.rs.start;return ui.rs.fmt==='time'?fmtT(Math.max(0,ui.rs.dur*1000-e)+999):fmtT(e)}
function rStart(){if(ui.rs.start)return;ui.rs.start=Date.now();ui.rs.tid=setInterval(()=>{const el=document.getElementById('rt');if(el)el.textContent=rClock();if(ui.rs.fmt==='time'&&Date.now()-ui.rs.start>=ui.rs.dur*1000)endRush()},200)}
function rPaint(){const U=ui.rs.q[ui.rs.u],T=U.t[ui.rs.k],key=ui.rs.u+'|'+ui.rs.k+'|'+ui.rs.wrong,cf=document.getElementById('cf');if(!cf)return;
  if(key!==ui.rs.ck){const multi=U.t.length>1;
    cf.outerHTML=`<div class="cd front ${ui.rs.ckU!==ui.rs.u?'in':''} ${ui.rs.wrong?'bad':''}" id="cf">${U.f&&ui.rs.wrong?`<span class="mean">« ${U.f} »</span>`:''}<div class="ck ${multi?'w':''}" lang="ja">${U.t.map((t,k)=>`<i class="${k<ui.rs.k?'dn':k===ui.rs.k&&multi?'cur':''}">${t.c}</i>`).join('')}</div>${ui.rs.wrong?`<span class="reveal"><span lang="ja">${T.c}</span> = ${T.r}</span>`:''}</div>`;
    ui.rs.ck=key;ui.rs.ckU=ui.rs.u}
  document.getElementById('ty').textContent=ui.rs.typed;
  const left=ui.rs.q.length-ui.rs.u;document.getElementById('rc').innerHTML=ui.rs.fmt==='deck'?`${left}<small>/${ui.rs.q.length}</small>`:`${ui.rs.ok}<small> kana</small>`;
  if(ui.rs.fmt==='deck'){document.getElementById('b1').hidden=left<2;document.getElementById('b2').hidden=left<3}
  document.getElementById('rh').textContent=!ui.rs.start?'Le chrono démarre à ta première lettre.':ui.rs.wrong?'Tape la bonne lecture pour continuer.':''}
function flash(sel,cls,ms){const e=document.querySelector(sel);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);if(ms)setTimeout(()=>e.classList.remove(cls),ms)}
function rMiss(){const T=curTok();if(!ui.rs.wrong){ui.rs.err++;ui.rs.res[ui.rs.u]=false;ui.rs.miss.set(T.c,T.r)}ui.rs.wrong=true}
function rKey(k){if(!ui.rs||ui.view!=='rush')return;
  if(k==='back'){ui.rs.typed=ui.rs.typed.slice(0,-1);return rPaint()}
  if(k==='clear'){ui.rs.typed='';return rPaint()}
  if(k==='skip'){rStart();if(!ui.rs.wrong)sfx('bad');rMiss();ui.rs.typed='';return rPaint()}
  if(k==='restart'){stopRush();return startRush()}
  if(!/^[a-z-]$/.test(k))return;
  flash(`.kb [data-k="${k}"]`,'hit',120);rStart();
  const T=curTok(),v=ui.rs.typed+k,c=[T.r,...T.al];
  if(ui.rs.afterN&&v==='n'&&!T.r.startsWith('n')){ui.rs.afterN=false;return}
  ui.rs.afterN=false;
  if(c.includes(v)){if(!ui.rs.wrong)ui.rs.ok++;ui.rs.afterN=T.r==='n';ui.rs.wrong=false;ui.rs.k++;ui.rs.typed='';
    if(ui.rs.k>=ui.rs.q[ui.rs.u].t.length){sfx(ui.rs.res[ui.rs.u]===false?'tick':'card');if(ui.rs.res[ui.rs.u]!==false)ui.rs.res[ui.rs.u]=true;ui.rs.u++;ui.rs.k=0;}else sfx('tick');if(ui.rs.k===0){
      if(ui.rs.fmt==='time')rFill();else if(ui.rs.u>=ui.rs.q.length)return endRush()}
    return rPaint()}
  if(c.some(x=>x.startsWith(v))){ui.rs.typed=v;return rPaint()}
  rMiss();ui.rs.typed='';sfx('bad');rPaint();flash('#ty','err')}
function endRush(){if(!ui.rs||ui.view!=='rush')return;stopRush();const tot=ui.rs.ok+ui.rs.err,ms=ui.rs.start?Date.now()-ui.rs.start:0;
  ui.rs.ms=ui.rs.fmt==='deck'?ms:ui.rs.dur*1000;ui.rs.kpm=ui.rs.ms?Math.round(ui.rs.ok/(ui.rs.ms/60000)):0;ui.rs.acc=tot?Math.round(ui.rs.ok/tot*100):0;
  const k=rkey(),b=S.best[k];
  if(ui.rs.fmt==='deck'){ui.rs.record=!!ui.rs.ok&&(!b||b.n!==ui.rs.q.length||ui.rs.ms<b.ms);if(ui.rs.record)S.best[k]={ms:ui.rs.ms,n:ui.rs.q.length,acc:ui.rs.acc}}
  else{ui.rs.record=!!ui.rs.ok&&(!b||ui.rs.kpm>b.kpm);if(ui.rs.record)S.best[k]={kpm:ui.rs.kpm,acc:ui.rs.acc}}
  ui.rs.prev=b;if(ui.rs.ok)sfx('done');if(ui.rs.ok)addXp(ui.rs.ok);else save();ui.view='rushres';render()}
const KB=[...'azertyuiop',...'qsdfghjklm',['restart','↻','Recommencer'],...'wxcvbn',['skip','→','Passer'],['back','←','Effacer une lettre'],['clear','«','Tout effacer']];
function rushV(){return`<div class="rz"><div class="rz-top"><button class="x" data-act="rquit" aria-label="Quitter">×</button><span class="rz-tag">${ui.rs.fmt==='deck'?'Paquet complet':'Contre la montre · '+ui.rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</span>${muteBtn()}${daru('idle',36,allDone())}</div>
  <div class="stage"><div class="deck"><div class="cd b2" id="b2"></div><div class="cd b1" id="b1"></div><div class="cd front" id="cf"></div></div></div>
  <p class="hintline" id="rh"></p>
  <div class="rbar"><span class="t" id="rt">${rClock()}</span><div class="typed" id="ty" aria-live="polite"></div><span class="c" id="rc"></span></div>
  <div class="kb">${KB.map(k=>typeof k==='string'?`<button data-act="rk" data-k="${k}">${k.toUpperCase()}</button>`:`<button class="fn" data-act="rk" data-k="${k[0]}" aria-label="${k[2]}" title="${k[2]}">${k[1]}</button>`).join('')}</div></div>`}
function rushResV(){const m=[...ui.rs.miss],deck=ui.rs.fmt==='deck';
  const talk=!ui.rs.ok?'Le chrono n’a pas vraiment tourné… On en refait une ?'
    :ui.rs.record?`Nouveau record ! ${ui.rs.prev?(deck?`Avant : ${fmtT(ui.rs.prev.ms)}.`:`Avant : ${ui.rs.prev.kpm} kana/min.`):'Premier score enregistré.'}`
    :ui.rs.kpm<15?'Bon début : la vitesse vient avec les révisions.':ui.rs.kpm<30?'Ça commence à filer, continue !':ui.rs.kpm<50?'Très rapide, tu lis presque sans réfléchir.':'Vitesse de ninja. Daru est impressionné.';
  return top()+`<section class="band"><div class="wrap narrow res"><p class="lead">Rafale · ${deck?'paquet de '+ui.rs.q.length+' cartes':ui.rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</p>
  <div class="big-n">${deck?fmtT(ui.rs.ms):ui.rs.kpm}</div><p class="lead" style="margin-top:-4px">${deck?'pour finir le paquet':'kana par minute'}</p>
  <div class="rfigs"><div class="fig1"><b>${deck?ui.rs.kpm:ui.rs.ok}</b><span>${deck?'kana/min':'kana justes'}</span></div><div class="fig1"><b>${ui.rs.acc} %</b><span>précision</span></div><div class="fig1"><b>${ui.rs.err}</b><span>erreurs</span></div></div>
  ${m.length?`<h2 style="margin-top:14px">À retravailler</h2><div class="mrow">${m.map(([c,r])=>`<button class="mk" data-act="say" data-t="${c}"><span lang="ja">${c}</span><small>${r}</small></button>`).join('')}</div>`:''}
  ${mascot(ui.rs.record&&ui.rs.ok?'happy':'idle',talk,70)}
  <div class="acts"><button class="btn ac" data-act="rstart">Rejouer</button><button class="btn gh" data-act="home">Retour</button></div></div></section>`}

function render(){app.innerHTML={home:homeV,cards:cardsV,quiz:quizV,res:resV,set:setV,rush:rushV,rushres:rushResV,brush:brushV,brushres:brushResV}[ui.view]();
  if(!KS&&!ksP&&(ui.view==='cards'||(ui.view==='home'&&S.page==='brush')))loadKS().then(()=>{if(ui.view==='cards'||ui.view==='home')render()}).catch(()=>{});
  const pid=['cp','qp','bp'].find(i=>document.getElementById(i));
  if(!pid)ui.PAD=null;else{const P=mountPad(pid),mo=(c,ok)=>P.over(modelSVG(c,{cls:ok?'okm':'badm',speed:.45}));
    if(pid==='qp'&&ui.ses&&ui.ses.ans){P.locked=true;P.fade=true;P.redraw();mo(cur().c,ui.ses.ans.ok)}
    if(pid==='cp'&&ui.ses&&ui.ses.tdone)mo(LES[ui.ses.id].items[ui.ses.ci],ui.ses.tok);
    if(pid==='bp'&&ui.bs){P.onStroke=()=>{if(!ui.bs.start){ui.bs.start=Date.now();ui.bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}};if(ui.bs.state==='done')mo(ui.bs.q[ui.bs.u],ui.bs.r.ok)}}
  if(ui.view==='rush')rPaint();
  if(ui.view!==ui.lastView){window.scrollTo(0,0);ui.lastView=ui.view}
  if(ui.view==='cards')say(LES[ui.ses.id].items[ui.ses.ci]);
  if(ui.view==='quiz'){const Q=cur();if(ui.ses.ans){const b=document.getElementById('nb');b&&b.focus({preventScroll:true})}else if(Q.type==='type'){const i=document.getElementById('ti');i&&i.focus({preventScroll:true})}else if(Q.type==='ear')say(Q.c)}}

/* ---------- événements ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
  if(a!=='reset')ui.armed=false;if(a!=='delacc')ui.armedDel=false;
  switch(a){
    case'lesson':startLesson(id);break;case'test':startTest(id);break;case'review':startReview(false);break;case'practice':startReview(true);break;
    case'say':say(b.dataset.t);break;case'tab':S.tab=id;save();render();break;case'page':S.page=id;save();render();break;
    case'cnext':ui.ses.ci++;ui.ses.tr=false;ui.ses.tdone=false;ui.ses.tmsg='';render();break;case'prev':ui.ses.ci--;ui.ses.tr=false;ui.ses.tdone=false;ui.ses.tmsg='';render();break;case'go':initQuiz(lessonQueue());render();break;
    case'opt':answer(+b.dataset.i);break;case'next':next();break;
    case'rset':{const k=b.dataset.k;S[k]=['rdu','bl','bn'].includes(k)?+b.dataset.v:b.dataset.v;save();render();break}
    case'rstart':startRush();break;
    case'replay':{const tm=document.getElementById('tm');if(tm)tm.innerHTML=modelSVG(LES[ui.ses.id].items[ui.ses.ci]);break}
    case'ctrace':ui.ses.tr=true;ui.ses.tmsg='';ui.ses.tdone=false;render();break;
    case'ccheck':{const c=LES[ui.ses.id].items[ui.ses.ci],st=strokesOf(ui.PAD);if(!st.length)break;const r=judgeDraw(st,c);ui.ses.tok=r.ok;ui.ses.tmsg=(r.ok?'Bien tracé ! ':'')+r.tip;ui.ses.tdone=true;ui.PAD.locked=true;ui.PAD.fade=true;sfx(r.ok?'ok':'bad');render();break}
    case'cagain':ui.ses.tdone=false;ui.ses.tmsg='';ui.PAD&&ui.PAD.reset();render();break;
    case'pundo':ui.PAD&&ui.PAD.undo();break;case'pclear':ui.PAD&&ui.PAD.clear();break;
    case'qcheck':{const Q=cur(),st=strokesOf(ui.PAD);if(!st.length||ui.ses.ans)break;const r=judgeDraw(st,Q.c);ui.PAD.locked=true;ui.PAD.fade=true;ui.ses.prevBox=ui.ses.prevBox||{};if(S.learned[Q.c]&&ui.ses.prevBox[Q.c]==null)ui.ses.prevBox[Q.c]=S.learned[Q.c].box;settle(r.ok,{tip:r.tip,draw:true});break}
    case'qself':{const Q=cur(),A=ui.ses.ans;if(!A||A.ok||A.self)break;A.self=true;A.ok=true;A.msg='Compté juste.';A.tip='';
      if(!Q.retry){ui.ses.ok++;ui.ses.xp+=2;ui.ses.miss.delete(Q.c);if(ui.ses.graded.has(Q.c)&&S.learned[Q.c]){S.learned[Q.c].box=ui.ses.prevBox[Q.c]||1;grade(Q.c,true);save()}}
      const lq=ui.ses.queue[ui.ses.queue.length-1];if(lq&&lq.retry&&lq.c===Q.c)ui.ses.queue.pop();sfx('ok');render();break}
    case'bstart':startBrush();break;
    case'bhint':{if(!ui.bs||ui.bs.state==='done')break;const base=BASE_AID[ui.bs.lvl];ui.bs.h=Math.min(3,Math.max(base,ui.bs.h)+1);ui.aidAnim=ui.bs.h===3;sfx('tick');render();break}
    case'qhint':{const Q=cur();if(!Q||ui.ses.ans)break;Q.h=Math.min(3,(Q.h||0)+1);ui.aidAnim=Q.h===3;sfx('tick');render();break}case'bcheck':bCheck();break;case'bnext':bNext();break;
    case'bretry':ui.bs.state='draw';ui.bs.r=null;ui.PAD&&ui.PAD.reset();render();break;
    case'bskip':{if(ui.bs.state==='done')break;if(!ui.bs.start){ui.bs.start=Date.now();ui.bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}
      ui.bs.r={ok:false,tip:'Voici comment le tracer : observe l’ordre des traits.',self:true};ui.bs.state='done';if(ui.bs.res[ui.bs.u]==null){ui.bs.res[ui.bs.u]=false;ui.bs.err++;ui.bs.miss.add(ui.bs.q[ui.bs.u])}if(ui.PAD){ui.PAD.locked=true;ui.PAD.fade=true}sfx('bad');render();break}
    case'bself':{if(ui.bs.res[ui.bs.u]===false){ui.bs.res[ui.bs.u]=true;ui.bs.ok++;ui.bs.err--;ui.bs.miss.delete(ui.bs.q[ui.bs.u])}ui.bs.r.ok=true;ui.bs.r.self=true;ui.bs.r.tip='Compté juste.';sfx('ok');render();break}
    case'bquit':stopBrush();ui.bs=null;ui.PAD=null;ui.view='home';render();break;case'lreset':cloud.step='';cloud.msg='';render();break;case'atab':cloud.tab=id;cloud.msg='';cloud.step='';render();break;case'pwopen':cloud.pwOpen=true;cloud.msg='';render();break;case'logout':cloud.sb&&cloud.sb.auth.signOut();cloud.msg='';break;case'delacc':if(!ui.armedDel){ui.armedDel=true;render()}else{ui.armedDel=false;sbDelete()}break;case'mute':S.snd=S.snd===false;save();if(S.snd)sfx('ok');{const n=document.createElement('div');n.innerHTML=muteBtn();b.replaceWith(n.firstChild)}break;case'rk':rKey(b.dataset.k);break;
    case'rquit':stopRush();ui.rs=null;ui.view='home';render();break;
    case'quit':case'home':stopRush();stopBrush();ui.ses=null;ui.view='home';render();break;case'settings':ui.view='set';render();break;
    case'tog':S[b.dataset.k]=b.checked;save();break;
    case'copy':{const t=document.getElementById('exp');try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Copié'},()=>t.select())}catch(err){t.select()}break}
    case'reset':if(!ui.armed){ui.armed=true;render()}else{ui.armed=false;replaceState(fresh());ui.homeTip=null;save();ui.view='home';render()}break;
  }});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login')return sbLogin(e.target,e.submitter&&e.submitter.dataset.sub);if(e.target.id==='setpw')return sbSetPw(e.target);if(e.target.id==='tf')answerTyped(document.getElementById('ti').value);
  if(e.target.id==='imp'){const m=document.getElementById('impm');try{const v=JSON.parse(document.getElementById('impt').value);if(!v||typeof v.learned!=='object')throw 0;replaceState(Object.assign(fresh(),v));ui.homeTip=null;save();render();document.getElementById('impm').textContent='Progression importée.'}catch(err){m.textContent='Ce code n’est pas valide.'}}});
document.addEventListener('keydown',e=>{if(ui.view==='brush'&&ui.bs){if(e.target.tagName==='BUTTON')return;if(e.key==='Enter'){e.preventDefault();ui.bs.state==='done'?bNext():bCheck()}else if(e.key==='Backspace'){e.preventDefault();ui.PAD&&ui.PAD.undo()}else if(e.key==='Escape')ui.PAD&&ui.PAD.clear();return}if(ui.view==='rush'){if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;const m=/^[a-zA-Z-]$/.test(k)?k.toLowerCase():k==='Backspace'?'back':k==='Escape'?'clear':k==='ArrowRight'?'skip':null;if(m){e.preventDefault();rKey(m)}return}if(ui.view!=='quiz'||!ui.ses)return;if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
  if(ui.ses.ans){if(e.key==='Enter'){e.preventDefault();next()}return}if(cur().type!=='type'&&cur().type!=='draw'&&/^[1-4]$/.test(e.key))answer(+e.key-1)});
bindUI({render,view:()=>ui.view,go:v=>{ui.view=v},resetTip:()=>{ui.homeTip=null}});
render();cloudInit();loadKS().then(()=>{if(ui.view==='home'||ui.view==='cards')render()}).catch(()=>{});
</script></body></html>
