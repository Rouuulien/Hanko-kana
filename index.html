<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3402a"><meta name="description" content="Apprends les hiragana et katakana avec Daru : leçons, révisions espacées, mots et mode Rafale.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hanko"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hanko · kana</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly dojo coach — Daru the daruma talks, short and warm, in French
   IDEA: an eki stamp-rally trail: each lesson is a hanko to press, Daru paints his second eye at the end
   PICTURE: Daru beside the next lesson's kana, huge on a vermilion field; a zigzag stamp trail below
   COLOUR and TYPE: vermilion + sumi ink + a little gold on white; Zen Maru Gothic for kana and titles, Outfit for text
   LAYOUT: top bar, hero, figures, segmented nav (Parcours / Tableau / Mots); quiz in one calm column with Daru reacting */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf8,#141317);--card:light-dark(#fff,#1e1c22);--ink:light-dark(#1d1b20,#f2eee8);--mut:light-dark(#6b6670,#a8a2ab);--line:light-dark(#e8e3de,#34303a);--ac:light-dark(#e3402a,#ff6249);--hero:light-dark(#e3402a,#a92f1b);--gold:#f2b33d;--ok:light-dark(#1f7a4b,#5cc98a);--bad:light-dark(#b3261e,#ff8a80);--sh:0 18px 40px -26px rgba(40,10,0,.5)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Outfit,system-ui,sans-serif;overflow-x:clip}
[lang=ja]{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
h1,h2,h3{font-family:"Zen Maru Gothic",Outfit,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,48px);font-weight:900}h2{font-size:22px}h3{font-size:19px}
.band{padding:clamp(22px,4vw,52px) max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}.narrow{max-width:640px}
.mut{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 60%,transparent);outline-offset:2px}
.btn{min-height:50px;padding:0 26px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 55%,#000);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.wh{background:#fff;color:#b8301d;box-shadow:0 4px 0 #8f2515}.btn.ac{background:var(--ac);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.btn.gh{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 10px max(5vw,16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font:900 22px "Zen Maru Gothic",sans-serif}
.tstats{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.pill svg{width:18px;height:18px}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
/* hero */
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:40px solid rgba(255,255,255,.07)}
.hero-g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;position:relative;z-index:1}
.kick{margin:0 0 6px;font-weight:500;opacity:.9}
.big-k{font:900 clamp(58px,10vw,120px)/1 "Zen Maru Gothic",sans-serif;letter-spacing:.06em;margin:14px 0 22px;overflow-wrap:anywhere;text-shadow:0 6px 0 rgba(0,0,0,.12)}
.rev{background:var(--card);color:var(--ink);border-radius:26px;padding:22px;display:grid;gap:6px;box-shadow:var(--sh)}
.rev-n{font:900 clamp(52px,8vw,72px)/1 "Zen Maru Gothic",sans-serif;color:var(--ac)}.rev p{margin:0}.rev .btn{margin-top:10px;justify-self:start}
/* mascot */
.mascot{display:flex;align-items:flex-end;gap:12px}
.daru{flex:none;overflow:visible}.daru.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-2deg)}}
.bubble{position:relative;background:var(--card);color:var(--ink);border-radius:20px 20px 20px 6px;padding:12px 16px;font-size:16px;box-shadow:var(--sh);max-width:46ch;margin-bottom:22px}
.bubble b{color:var(--ac)}.bubble .w{font-size:22px;font-weight:700}
.hero .mascot{margin-bottom:6px}
/* figures + nav */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fig1{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px 16px}
.fig1 b{display:block;font:900 28px/1.1 "Zen Maru Gothic",sans-serif;white-space:nowrap}.fig1 span{color:var(--mut);font-size:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);width:max-content;max-width:100%;margin:0 auto 8px}
.seg button{min-height:44px;padding:0 20px;border-radius:999px;border:0;background:none;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
/* trail */
.unit{margin:26px auto 0;max-width:560px}
.uhead{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.uhead.full{background:color-mix(in srgb,var(--ac) 10%,var(--card));border-color:color-mix(in srgb,var(--ac) 30%,var(--line))}
.uhead .ub{flex:1}.ubar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.ubar i{display:block;height:100%;background:var(--ac)}
.trail{display:grid;justify-items:center;gap:14px;padding:22px 0 6px}
.stp{width:132px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--x));position:relative}
.sk{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font:900 28px "Zen Maru Gothic",sans-serif;background:var(--card);color:var(--ac);border:3px solid var(--ac);box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 35%,var(--line));transition:transform .15s}
.stp:not(:disabled):hover .sk{transform:rotate(-6deg) scale(1.05)}
.stp.done .sk{background:var(--ac);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 60%,#000)}
.stp.lock{cursor:default}.stp.lock .sk{border:3px dashed var(--line);color:var(--mut);background:transparent;box-shadow:none}
.stp.cur .sk{width:86px;height:86px;font-size:32px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 35%,var(--line)),0 0 0 0 color-mix(in srgb,var(--ac) 40%,transparent)}70%{box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 35%,var(--line)),0 0 0 16px transparent}}
.stp.test .sk{border-radius:20px;border-color:var(--gold);color:#b7861d}.stp.test.done .sk{background:var(--gold);color:#5a3d00;box-shadow:0 5px 0 #b7861d}
.sl{font-size:14px;color:var(--mut);text-align:center;line-height:1.2}.stp.cur .sl{color:var(--ink);font-weight:600}
.go{position:absolute;top:-30px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap}
.go::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
/* sheet */
.sheet{max-width:640px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.tabs{display:flex;gap:6px;margin:12px 0 16px}.tabs button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g5,.g3{display:grid;gap:6px}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:6px 2px;display:grid;place-items:center;min-height:58px}
.cell span{font-size:24px;line-height:1.1}.cell small{font-size:13px;color:var(--mut)}.cell.nil{border:0;background:none}
.b1{background:color-mix(in srgb,var(--ac) 12%,var(--card))}.b2{background:color-mix(in srgb,var(--ac) 26%,var(--card))}
.b3{background:color-mix(in srgb,var(--ac) 42%,var(--card))}.b4{background:color-mix(in srgb,var(--ac) 62%,var(--card))}
.b5{background:color-mix(in srgb,var(--ac) 82%,var(--card))}.b6{background:var(--ac)}
.b4,.b5,.b6{color:#fff;border-color:transparent}.b4 small,.b5 small,.b6 small{color:rgba(255,255,255,.88)}
.sub{font-size:14px;color:var(--mut);margin:16px 0 8px}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:14px}.leg i{width:56px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--card),var(--ac));border:1px solid var(--line)}
/* words */
.words{max-width:760px;margin:0 auto}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.wd{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;text-align:left;display:grid;gap:2px}
.wd .j{font-size:24px;font-weight:700}.wd .r{color:var(--ac);font-weight:600}.wd .f{color:var(--mut);font-size:14px}
.wd.locked{opacity:.55;border-style:dashed}.wd.locked .r,.wd.locked .f{visibility:hidden}
.lg{display:grid;gap:10px}.amsg{margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,var(--card));font-size:15px}.lg .btn{justify-self:start}.foot a,.foot .link{font-size:13px}
.foot{font-size:13px;color:var(--mut);text-align:center;padding:24px 16px 32px}
/* quiz */
.qtop{display:flex;align-items:center;gap:14px;padding:calc(14px + env(safe-area-inset-top)) max(5vw,16px) 14px;max-width:720px;margin:0 auto}
.bar{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:7px;transition:width .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.combo{font-weight:700;color:var(--ac);white-space:nowrap;font-size:15px}
.qz{max-width:640px;margin:0 auto;padding:4px max(5vw,16px) 40px}
.ask{color:var(--mut);font-size:17px;text-align:center;margin:8px 0 0}
.prompt{min-height:200px;display:grid;place-items:center}.prompt.short{min-height:90px}
.pk{font:900 clamp(96px,22vw,140px)/1 "Zen Maru Gothic",sans-serif}
.pr{font:700 clamp(52px,12vw,72px)/1 Outfit,sans-serif;letter-spacing:.02em}
.ear{width:120px;height:120px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 color-mix(in srgb,var(--ac) 60%,#000)}.ear svg{width:52px;height:52px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:24px;font-weight:600;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ka{font-size:36px}.opt kbd{position:absolute;top:8px;left:10px;font:13px Outfit,sans-serif;color:var(--mut)}
.opt:not(:disabled):hover{border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card));box-shadow:0 4px 0 var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card));box-shadow:0 4px 0 var(--bad);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt:disabled{cursor:default}
.tf{display:grid;gap:12px}.tf input{font:600 26px Outfit,sans-serif;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.tf input.ok{border-color:var(--ok)}.tf input.bad{border-color:var(--bad)}
.fb{position:sticky;bottom:0;margin-top:20px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;flex-wrap:wrap;box-shadow:var(--sh)}
.fb .daru{margin-bottom:-4px}.fb .msg{flex:1 1 200px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,var(--bg));border:2px solid var(--ok)}.fb.bad{background:color-mix(in srgb,var(--bad) 10%,var(--bg));border:2px solid var(--bad)}
.fb b{display:block;font-size:18px}.fb .note{display:block;font-size:15px;color:var(--mut)}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:26px 20px;text-align:center;display:grid;justify-items:center;gap:6px;box-shadow:var(--sh)}
.card .pk{font-size:clamp(110px,26vw,170px)}.card .ro{font:700 34px Outfit,sans-serif;color:var(--ac)}
.say{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none}.say svg{width:20px;height:20px}
.hint{margin:4px 0 0;color:var(--mut);max-width:44ch}
.card-m{margin-top:16px}.card-m .bubble{margin-bottom:18px}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ac)}
.link{background:none;border:0;color:var(--mut);min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
/* results */
.res{text-align:center;display:grid;justify-items:center;gap:10px}
.stamp{width:140px;height:140px;color:var(--ac);transform:rotate(-8deg)}.stamp.off{color:var(--mut)}
.stamp.on{animation:press .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes press{from{transform:scale(1.7) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.lead{font-size:18px;color:var(--mut);margin:0}
.mrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mk{min-width:64px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid}.mk span{font-size:28px}.mk small{font-size:13px;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.res .mascot{text-align:left;margin-top:8px}
/* settings */
.set{display:grid;gap:12px}.set h2{margin-top:16px}
.back{justify-self:start;background:none;border:0;color:var(--mut);min-height:44px;padding:0}
.tg{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer}
.tg input{width:22px;height:22px;margin-top:2px;accent-color:var(--ac)}.tg small{display:block;color:var(--mut);font-size:14px}
textarea{width:100%;font:14px/1.4 ui-monospace,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#imp{display:grid;gap:10px}#imp .btn,.set>.btn{justify-self:start}
/* tracé */
.model{width:100%;height:100%;display:block}.model path{fill:none;stroke:var(--ink);stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.model text{font:600 7.5px Outfit,sans-serif;fill:var(--ac)}
.model.anim path{stroke-dasharray:1;stroke-dashoffset:1;animation:kd .5s ease-out forwards}.model.anim text{opacity:0;animation:kf .2s forwards}
@keyframes kd{to{stroke-dashoffset:0}}@keyframes kf{to{opacity:1}}
.model.ghost path{stroke:color-mix(in srgb,var(--ink) 13%,transparent);stroke-width:5}
.model.okm path{stroke:var(--ok)}.model.badm path{stroke:var(--ac)}
.trace{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}
.tmodel{width:120px;height:120px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.trace .tt{display:grid;gap:8px;justify-items:start}.trace b{font-size:16px}
.pad{position:relative;width:min(100%,330px,46vh);aspect-ratio:1;margin:0 auto;border-radius:24px;background:var(--card);border:2px solid var(--line);color:var(--ink);overflow:hidden;
  background-image:linear-gradient(90deg,transparent calc(50% - .5px),color-mix(in srgb,var(--ink) 8%,transparent) calc(50% - .5px) calc(50% + .5px),transparent 0),linear-gradient(transparent calc(50% - .5px),color-mix(in srgb,var(--ink) 8%,transparent) calc(50% - .5px) calc(50% + .5px),transparent 0)}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad .pguide,.pad .pover{position:absolute;inset:0;pointer-events:none}
.pad.dark{background-color:#fffdf9;color:#1d1b20;border-color:#fffdf9;box-shadow:0 26px 50px -22px rgba(0,0,0,.9),0 0 46px -12px rgba(255,98,73,.45)}
.pad.dark .model text{fill:#e3402a}.pad.dark .model path{stroke:#1d1b20}.pad.dark .model.okm path{stroke:#1f7a4b}.pad.dark .model.badm path{stroke:#e3402a}
.ptools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:12px}
.btn.sm{min-height:44px;padding:0 16px;font-size:15px}
.tpad{margin-top:12px;display:grid;gap:4px}.tmsg{text-align:center;margin:8px 0 0;font-size:15px}.tmsg.ok{color:var(--ok)}.tmsg.bad{color:var(--bad)}
.bz .bstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:4px 16px;min-height:0}
.bprompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}.bcount{font-size:14px;color:#a8a2ab;border:1px solid #34303a;border-radius:999px;padding:4px 10px}.bro{font:800 clamp(40px,10vw,56px)/1 Outfit,sans-serif;letter-spacing:.03em}
.bz .say{border-color:#34303a;color:#f2eee8}.bz .btn.gh{color:#f2eee8;border-color:#34303a}.bz .link{color:#a8a2ab}
.bfb{text-align:center;display:grid;gap:2px;max-width:420px}.bfb b{font-size:18px}.bfb.ok b{color:#5cc98a}.bfb.bad b{color:#ff8a80}.bfb span{color:#a8a2ab;font-size:15px}
.bscore{font-size:20px;letter-spacing:0}.bscore::after{display:none}
.mkm{width:84px}.mkm .mm{display:block;width:60px;height:60px;margin:0 auto}
.seg{overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}.seg button{flex:none}
@media (prefers-reduced-motion:reduce){.model.anim path{animation:none;stroke-dashoffset:0}.model.anim text{animation:none;opacity:1}}
.pad .phint{position:absolute;inset:0;pointer-events:none}
.aid{width:100%;height:100%}.aid .g{fill:none;stroke:color-mix(in srgb,currentColor 13%,transparent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.aid .nx{fill:none;stroke:#e3402a;opacity:.55;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:kd .9s .15s ease-out forwards}
.aid circle{fill:#e3402a}.aid text{font:700 5.6px Outfit,sans-serif;fill:#fff;text-anchor:middle}
.model.hintm path{stroke:color-mix(in srgb,#e3402a 45%,transparent)}
.hintb{border-color:color-mix(in srgb,var(--gold) 70%,transparent)!important}
.lvl{font-size:14px;color:var(--mut);margin:-2px 0 0}

/* ---------- données ---------- */
const ROWS=[['a','あいうえお','a i u e o'],['ka','かきくけこ','ka ki ku ke ko'],['sa','さしすせそ','sa shi su se so'],['ta','たちつてと','ta chi tsu te to'],['na','なにぬねの','na ni nu ne no'],['ha','はひふへほ','ha hi fu he ho'],['ma','まみむめも','ma mi mu me mo'],['ya','やゆよ','ya yu yo'],['ra','らりるれろ','ra ri ru re ro'],['wa','わをん','wa wo n']];

/* ---------- Rafale : paquet de cartes à taper ---------- */
const unitK=c=>({j:c,t:[{c,r:ITEMS[c].r,al:ITEMS[c].al}]});
function unitW(w){const ch=[...w.j],t=[];for(let i=0;i<ch.length;){const two=ch[i]+(ch[i+1]||'');if(ITEMS[two]){t.push({c:two,r:ITEMS[two].r,al:ITEMS[two].al});i+=2;continue}const c=ch[i];
  if(c==='ー'){const v=((t[t.length-1]||{r:''}).r.match(/[aiueo]$/)||['-'])[0];t.push({c,r:v,al:['-']})}else t.push({c,r:ITEMS[c].r,al:ITEMS[c].al});i++}return{j:w.j,f:w.f,t}}
function rushPool(sc,ct){if(ct==='words')return WORDS.filter(w=>canRead(w)&&(sc==='b'||w.s===sc)).map(unitW);return Object.keys(S.learned).filter(c=>sc==='b'||ITEMS[c].s===sc).map(unitK)}
const rkey=()=>(S.rfmt||'deck')+'-'+S.rsc+'-'+S.rct+(S.rfmt==='time'?'-'+S.rdu:'');
const fmtT=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let rs=null;
function rushSetupV(){const pool=rushPool(S.rsc,S.rct),b=S.best[rkey()],deck=S.rfmt!=='time',kind=S.rct==='words'?'mots':'kana';
  const grp=(lab,k,opts)=>`<div class="og"><span>${lab}</span><div class="chips">${opts.map(([v,t])=>`<button data-act="rset" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k]||'deck')===String(v)}">${t}</button>`).join('')}</div></div>`;
  const ok=pool.length>=5;
  const talk=!ok?`Il me faut au moins 5 ${S.rct==='words'?'mots lisibles':'kana appris'} dans cette sélection. Fais encore une leçon et reviens !`
    :deck?`Ton paquet de <b>${pool.length} ${kind}</b> défile une fois. Tape la lecture, sans valider : le chrono s’arrête à la dernière carte.`
    :`Les ${kind} défilent sans fin pendant ${S.rdu} s. Tape-en le plus possible !`;
  const best=!b?'Pas encore de record pour ces réglages.':deck?`Ton record : <b>${fmtT(b.ms)}</b> pour ${b.n} cartes, ${b.acc} % de précision`:`Ton record : <b>${b.kpm} kana/min</b>, ${b.acc} % de précision`;
  return`<div class="rset">${mascot('idle',talk,64)}
  ${grp('Format','rfmt',[['deck','Paquet complet'],['time','Contre la montre']])}${grp('Écriture','rsc',[['h','Hiragana'],['k','Katakana'],['b','Les deux']])}${grp('Contenu','rct',[['kana','Kana seuls'],['words','Mots']])}${deck?'':grp('Durée','rdu',[[30,'30 s'],[60,'1 min'],[120,'2 min']])}
  <p class="rbest">${best}</p><button class="btn ac" data-act="rstart" ${ok?'':'disabled'}>Lancer la rafale</button></div>`}
function rFill(){while(rs.q.length<rs.u+10){let n,g=0;do{n=pick(rs.pool)}while(rs.q.length&&n.j===rs.q[rs.q.length-1].j&&g++<5);rs.q.push(n)}}
function startRush(){const pool=rushPool(S.rsc,S.rct);if(pool.length<5)return;const fmt=S.rfmt==='time'?'time':'deck';
  rs={fmt,pool,dur:+S.rdu,q:fmt==='deck'?shuffle(pool):[],u:0,k:0,typed:'',res:[],wrong:false,start:0,ok:0,err:0,miss:new Map(),afterN:false,tid:0,ck:'',ckU:-1};
  if(fmt==='time')rFill();view='rush';render()}
function stopRush(){if(rs&&rs.tid){clearInterval(rs.tid);rs.tid=0}}
const curTok=()=>rs.q[rs.u].t[rs.k];
function rClock(){if(!rs.start)return fmtT(rs.fmt==='time'?rs.dur*1000:0);const e=Date.now()-rs.start;return rs.fmt==='time'?fmtT(Math.max(0,rs.dur*1000-e)+999):fmtT(e)}
function rStart(){if(rs.start)return;rs.start=Date.now();rs.tid=setInterval(()=>{const el=document.getElementById('rt');if(el)el.textContent=rClock();if(rs.fmt==='time'&&Date.now()-rs.start>=rs.dur*1000)endRush()},200)}
function rPaint(){const U=rs.q[rs.u],T=U.t[rs.k],key=rs.u+'|'+rs.k+'|'+rs.wrong,cf=document.getElementById('cf');if(!cf)return;
  if(key!==rs.ck){const multi=U.t.length>1;
    cf.outerHTML=`<div class="cd front ${rs.ckU!==rs.u?'in':''} ${rs.wrong?'bad':''}" id="cf">${U.f&&rs.wrong?`<span class="mean">« ${U.f} »</span>`:''}<div class="ck ${multi?'w':''}" lang="ja">${U.t.map((t,k)=>`<i class="${k<rs.k?'dn':k===rs.k&&multi?'cur':''}">${t.c}</i>`).join('')}</div>${rs.wrong?`<span class="reveal"><span lang="ja">${T.c}</span> = ${T.r}</span>`:''}</div>`;
    rs.ck=key;rs.ckU=rs.u}
  document.getElementById('ty').textContent=rs.typed;
  const left=rs.q.length-rs.u;document.getElementById('rc').innerHTML=rs.fmt==='deck'?`${left}<small>/${rs.q.length}</small>`:`${rs.ok}<small> kana</small>`;
  if(rs.fmt==='deck'){document.getElementById('b1').hidden=left<2;document.getElementById('b2').hidden=left<3}
  document.getElementById('rh').textContent=!rs.start?'Le chrono démarre à ta première lettre.':rs.wrong?'Tape la bonne lecture pour continuer.':''}
function flash(sel,cls,ms){const e=document.querySelector(sel);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);if(ms)setTimeout(()=>e.classList.remove(cls),ms)}
function rMiss(){const T=curTok();if(!rs.wrong){rs.err++;rs.res[rs.u]=false;rs.miss.set(T.c,T.r)}rs.wrong=true}
function rKey(k){if(!rs||view!=='rush')return;
  if(k==='back'){rs.typed=rs.typed.slice(0,-1);return rPaint()}
  if(k==='clear'){rs.typed='';return rPaint()}
  if(k==='skip'){rStart();if(!rs.wrong)sfx('bad');rMiss();rs.typed='';return rPaint()}
  if(k==='restart'){stopRush();return startRush()}
  if(!/^[a-z-]$/.test(k))return;
  flash(`.kb [data-k="${k}"]`,'hit',120);rStart();
  const T=curTok(),v=rs.typed+k,c=[T.r,...T.al];
  if(rs.afterN&&v==='n'&&!T.r.startsWith('n')){rs.afterN=false;return}
  rs.afterN=false;
  if(c.includes(v)){if(!rs.wrong)rs.ok++;rs.afterN=T.r==='n';rs.wrong=false;rs.k++;rs.typed='';
    if(rs.k>=rs.q[rs.u].t.length){sfx(rs.res[rs.u]===false?'tick':'card');if(rs.res[rs.u]!==false)rs.res[rs.u]=true;rs.u++;rs.k=0;}else sfx('tick');if(rs.k===0){
      if(rs.fmt==='time')rFill();else if(rs.u>=rs.q.length)return endRush()}
    return rPaint()}
  if(c.some(x=>x.startsWith(v))){rs.typed=v;return rPaint()}
  rMiss();rs.typed='';sfx('bad');rPaint();flash('#ty','err')}
function endRush(){if(!rs||view!=='rush')return;stopRush();const tot=rs.ok+rs.err,ms=rs.start?Date.now()-rs.start:0;
  rs.ms=rs.fmt==='deck'?ms:rs.dur*1000;rs.kpm=rs.ms?Math.round(rs.ok/(rs.ms/60000)):0;rs.acc=tot?Math.round(rs.ok/tot*100):0;
  const k=rkey(),b=S.best[k];
  if(rs.fmt==='deck'){rs.record=!!rs.ok&&(!b||b.n!==rs.q.length||rs.ms<b.ms);if(rs.record)S.best[k]={ms:rs.ms,n:rs.q.length,acc:rs.acc}}
  else{rs.record=!!rs.ok&&(!b||rs.kpm>b.kpm);if(rs.record)S.best[k]={kpm:rs.kpm,acc:rs.acc}}
  rs.prev=b;if(rs.ok)sfx('done');if(rs.ok)addXp(rs.ok);else save();view='rushres';render()}
const KB=[...'azertyuiop',...'qsdfghjklm',['restart','↻','Recommencer'],...'wxcvbn',['skip','→','Passer'],['back','←','Effacer une lettre'],['clear','«','Tout effacer']];
function rushV(){return`<div class="rz"><div class="rz-top"><button class="x" data-act="rquit" aria-label="Quitter">×</button><span class="rz-tag">${rs.fmt==='deck'?'Paquet complet':'Contre la montre · '+rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</span>${muteBtn()}${daru('idle',36,allDone())}</div>
  <div class="stage"><div class="deck"><div class="cd b2" id="b2"></div><div class="cd b1" id="b1"></div><div class="cd front" id="cf"></div></div></div>
  <p class="hintline" id="rh"></p>
  <div class="rbar"><span class="t" id="rt">${rClock()}</span><div class="typed" id="ty" aria-live="polite"></div><span class="c" id="rc"></span></div>
  <div class="kb">${KB.map(k=>typeof k==='string'?`<button data-act="rk" data-k="${k}">${k.toUpperCase()}</button>`:`<button class="fn" data-act="rk" data-k="${k[0]}" aria-label="${k[2]}" title="${k[2]}">${k[1]}</button>`).join('')}</div></div>`}
function rushResV(){const m=[...rs.miss],deck=rs.fmt==='deck';
  const talk=!rs.ok?'Le chrono n’a pas vraiment tourné… On en refait une ?'
    :rs.record?`Nouveau record ! ${rs.prev?(deck?`Avant : ${fmtT(rs.prev.ms)}.`:`Avant : ${rs.prev.kpm} kana/min.`):'Premier score enregistré.'}`
    :rs.kpm<15?'Bon début : la vitesse vient avec les révisions.':rs.kpm<30?'Ça commence à filer, continue !':rs.kpm<50?'Très rapide, tu lis presque sans réfléchir.':'Vitesse de ninja. Daru est impressionné.';
  return top()+`<section class="band"><div class="wrap narrow res"><p class="lead">Rafale · ${deck?'paquet de '+rs.q.length+' cartes':rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</p>
  <div class="big-n">${deck?fmtT(rs.ms):rs.kpm}</div><p class="lead" style="margin-top:-4px">${deck?'pour finir le paquet':'kana par minute'}</p>
  <div class="rfigs"><div class="fig1"><b>${deck?rs.kpm:rs.ok}</b><span>${deck?'kana/min':'kana justes'}</span></div><div class="fig1"><b>${rs.acc} %</b><span>précision</span></div><div class="fig1"><b>${rs.err}</b><span>erreurs</span></div></div>
  ${m.length?`<h2 style="margin-top:14px">À retravailler</h2><div class="mrow">${m.map(([c,r])=>`<button class="mk" data-act="say" data-t="${c}"><span lang="ja">${c}</span><small>${r}</small></button>`).join('')}</div>`:''}
  ${mascot(rs.record&&rs.ok?'happy':'idle',talk,70)}
  <div class="acts"><button class="btn ac" data-act="rstart">Rejouer</button><button class="btn gh" data-act="home">Retour</button></div></div></section>`}

function render(){app.innerHTML={home:homeV,cards:cardsV,quiz:quizV,res:resV,set:setV,rush:rushV,rushres:rushResV,brush:brushV,brushres:brushResV}[view]();
  if(!KS&&!ksP&&(view==='cards'||(view==='home'&&S.page==='brush')))loadKS().then(()=>{if(view==='cards'||view==='home')render()}).catch(()=>{});
  const pid=['cp','qp','bp'].find(i=>document.getElementById(i));
  if(!pid)PAD=null;else{const P=mountPad(pid),mo=(c,ok)=>P.over(modelSVG(c,{cls:ok?'okm':'badm',speed:.45}));
    if(pid==='qp'&&ses&&ses.ans){P.locked=true;P.fade=true;P.redraw();mo(cur().c,ses.ans.ok)}
    if(pid==='cp'&&ses&&ses.tdone)mo(LES[ses.id].items[ses.ci],ses.tok);
    if(pid==='bp'&&bs){P.onStroke=()=>{if(!bs.start){bs.start=Date.now();bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}};if(bs.state==='done')mo(bs.q[bs.u],bs.r.ok)}}
  if(view==='rush')rPaint();
  if(view!==lastView){window.scrollTo(0,0);lastView=view}
  if(view==='cards')say(LES[ses.id].items[ses.ci]);
  if(view==='quiz'){const Q=cur();if(ses.ans){const b=document.getElementById('nb');b&&b.focus({preventScroll:true})}else if(Q.type==='type'){const i=document.getElementById('ti');i&&i.focus({preventScroll:true})}else if(Q.type==='ear')say(Q.c)}}

/* ---------- événements ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
  if(a!=='reset')armed=false;if(a!=='delacc')armedDel=false;
  switch(a){
    case'lesson':startLesson(id);break;case'test':startTest(id);break;case'review':startReview(false);break;case'practice':startReview(true);break;
    case'say':say(b.dataset.t);break;case'tab':S.tab=id;save();render();break;case'page':S.page=id;save();render();break;
    case'cnext':ses.ci++;ses.tr=false;ses.tdone=false;ses.tmsg='';render();break;case'prev':ses.ci--;ses.tr=false;ses.tdone=false;ses.tmsg='';render();break;case'go':initQuiz(lessonQueue());render();break;
    case'opt':answer(+b.dataset.i);break;case'next':next();break;
    case'rset':{const k=b.dataset.k;S[k]=['rdu','bl','bn'].includes(k)?+b.dataset.v:b.dataset.v;save();render();break}
    case'rstart':startRush();break;
    case'replay':{const tm=document.getElementById('tm');if(tm)tm.innerHTML=modelSVG(LES[ses.id].items[ses.ci]);break}
    case'ctrace':ses.tr=true;ses.tmsg='';ses.tdone=false;render();break;
    case'ccheck':{const c=LES[ses.id].items[ses.ci],st=strokesOf(PAD);if(!st.length)break;const r=judgeDraw(st,c);ses.tok=r.ok;ses.tmsg=(r.ok?'Bien tracé ! ':'')+r.tip;ses.tdone=true;PAD.locked=true;PAD.fade=true;sfx(r.ok?'ok':'bad');render();break}
    case'cagain':ses.tdone=false;ses.tmsg='';PAD&&PAD.reset();render();break;
    case'pundo':PAD&&PAD.undo();break;case'pclear':PAD&&PAD.clear();break;
    case'qcheck':{const Q=cur(),st=strokesOf(PAD);if(!st.length||ses.ans)break;const r=judgeDraw(st,Q.c);PAD.locked=true;PAD.fade=true;ses.prevBox=ses.prevBox||{};if(S.learned[Q.c]&&ses.prevBox[Q.c]==null)ses.prevBox[Q.c]=S.learned[Q.c].box;settle(r.ok,{tip:r.tip,draw:true});break}
    case'qself':{const Q=cur(),A=ses.ans;if(!A||A.ok||A.self)break;A.self=true;A.ok=true;A.msg='Compté juste.';A.tip='';
      if(!Q.retry){ses.ok++;ses.xp+=2;ses.miss.delete(Q.c);if(ses.graded.has(Q.c)&&S.learned[Q.c]){S.learned[Q.c].box=ses.prevBox[Q.c]||1;grade(Q.c,true);save()}}
      const lq=ses.queue[ses.queue.length-1];if(lq&&lq.retry&&lq.c===Q.c)ses.queue.pop();sfx('ok');render();break}
    case'bstart':startBrush();break;
    case'bhint':{if(!bs||bs.state==='done')break;const base=BASE_AID[bs.lvl];bs.h=Math.min(3,Math.max(base,bs.h)+1);aidAnim=bs.h===3;sfx('tick');render();break}
    case'qhint':{const Q=cur();if(!Q||ses.ans)break;Q.h=Math.min(3,(Q.h||0)+1);aidAnim=Q.h===3;sfx('tick');render();break}case'bcheck':bCheck();break;case'bnext':bNext();break;
    case'bretry':bs.state='draw';bs.r=null;PAD&&PAD.reset();render();break;
    case'bskip':{if(bs.state==='done')break;if(!bs.start){bs.start=Date.now();bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}
      bs.r={ok:false,tip:'Voici comment le tracer : observe l’ordre des traits.',self:true};bs.state='done';if(bs.res[bs.u]==null){bs.res[bs.u]=false;bs.err++;bs.miss.add(bs.q[bs.u])}if(PAD){PAD.locked=true;PAD.fade=true}sfx('bad');render();break}
    case'bself':{if(bs.res[bs.u]===false){bs.res[bs.u]=true;bs.ok++;bs.err--;bs.miss.delete(bs.q[bs.u])}bs.r.ok=true;bs.r.self=true;bs.r.tip='Compté juste.';sfx('ok');render();break}
    case'bquit':stopBrush();bs=null;PAD=null;view='home';render();break;case'lreset':cloud.step='';cloud.msg='';render();break;case'atab':cloud.tab=id;cloud.msg='';cloud.step='';render();break;case'pwopen':cloud.pwOpen=true;cloud.msg='';render();break;case'logout':cloud.sb&&cloud.sb.auth.signOut();cloud.msg='';break;case'delacc':if(!armedDel){armedDel=true;render()}else{armedDel=false;sbDelete()}break;case'mute':S.snd=S.snd===false;save();if(S.snd)sfx('ok');{const n=document.createElement('div');n.innerHTML=muteBtn();b.replaceWith(n.firstChild)}break;case'rk':rKey(b.dataset.k);break;
    case'rquit':stopRush();rs=null;view='home';render();break;
    case'quit':case'home':stopRush();stopBrush();ses=null;view='home';render();break;case'settings':view='set';render();break;
    case'tog':S[b.dataset.k]=b.checked;save();break;
    case'copy':{const t=document.getElementById('exp');try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Copié'},()=>t.select())}catch(err){t.select()}break}
    case'reset':if(!armed){armed=true;render()}else{armed=false;S=fresh();homeTip=null;save();view='home';render()}break;
  }});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login')return sbLogin(e.target,e.submitter&&e.submitter.dataset.sub);if(e.target.id==='setpw')return sbSetPw(e.target);if(e.target.id==='tf')answerTyped(document.getElementById('ti').value);
  if(e.target.id==='imp'){const m=document.getElementById('impm');try{const v=JSON.parse(document.getElementById('impt').value);if(!v||typeof v.learned!=='object')throw 0;S=Object.assign(fresh(),v);homeTip=null;save();render();document.getElementById('impm').textContent='Progression importée.'}catch(err){m.textContent='Ce code n’est pas valide.'}}});
document.addEventListener('keydown',e=>{if(view==='brush'&&bs){if(e.target.tagName==='BUTTON')return;if(e.key==='Enter'){e.preventDefault();bs.state==='done'?bNext():bCheck()}else if(e.key==='Backspace'){e.preventDefault();PAD&&PAD.undo()}else if(e.key==='Escape')PAD&&PAD.clear();return}if(view==='rush'){if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;const m=/^[a-zA-Z-]$/.test(k)?k.toLowerCase():k==='Backspace'?'back':k==='Escape'?'clear':k==='ArrowRight'?'skip':null;if(m){e.preventDefault();rKey(m)}return}if(view!=='quiz'||!ses)return;if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
  if(ses.ans){if(e.key==='Enter'){e.preventDefault();next()}return}if(cur().type!=='type'&&cur().type!=='draw'&&/^[1-4]$/.test(e.key))answer(+e.key-1)});
render();cloudInit();loadKS().then(()=>{if(view==='home'||view==='cards')render()}).catch(()=>{});
}
</script></body></html>
