const authErr=e=>{const m=(e&&e.message)||'';
  if(/invalid login credentials/i.test(m))return'E-mail ou mot de passe incorrect. Si ton compte a été créé avec un code ou un lien, définis d’abord un mot de passe (« Mot de passe oublié ? » ou depuis un appareil déjà connecté).';
  if(/already registered|already exists/i.test(m))return'Un compte existe déjà avec cette adresse : connecte-toi.';
  if(/email not confirmed/i.test(m))return'Adresse pas encore confirmée : ouvre le lien reçu par e-mail, puis reconnecte-toi ici.';
  if(/password.*(short|least|characters)|weak/i.test(m))return'Mot de passe trop faible : au moins 8 caractères, avec lettres et chiffres.';
  if(/rate|seconds|too many/i.test(m))return'Trop de tentatives : patiente une minute avant de réessayer.';
  return'Opération impossible pour le moment. Vérifie ta connexion et réessaie.'};
const redir=()=>location.origin+location.pathname;
async function sbLogin(form,act){const sb=cloud.sb;if(!sb)return;for(const b of form.querySelectorAll('button'))b.disabled=true;cloud.msg='';
  try{
    if(cloud.tab!=='code'){const email=(form.querySelector('#lmail').value||'').trim(),pw=(form.querySelector('#lpw')||{}).value||'';if(!email)throw{message:''};cloud.email=email;

        if(!data.session)cloud.msg='Compte créé ! Ouvre le lien de confirmation reçu par e-mail (sur n’importe quel appareil), puis reviens ici et connecte-toi.'}

    else if(cloud.step!=='code'){const email=form.querySelector('#lmail').value.trim();if(!email)throw{message:''};cloud.email=email;
      const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:redir()}});if(error)throw error;
      cloud.step='code';cloud.msg='Regarde ta boîte mail (et les indésirables). Saisis le code s’il y en a un, ou ouvre le lien reçu dans ce même navigateur.'}
    else{const token=form.querySelector('#lcode').value.replace(/\s/g,'');if(!token)throw{message:''};const{error}=await sb.auth.verifyOtp({email:cloud.email,token,type:'email'});if(error)cloud.msg='Code invalide ou expiré. Redemande un code si besoin.'}
  }catch(e){cloud.msg=e&&e.message?authErr(e):'Renseigne ton adresse e-mail.'}

async function sbSetPw(form){const sb=cloud.sb,pw=form.querySelector('#npw').value;for(const b of form.querySelectorAll('button'))b.disabled=true;

function tone(f,t0,d,type,vol){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.16,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

function opts(c){const it=ITEMS[c],P=Object.values(ITEMS).filter(x=>x.s===it.s&&x.c!==c&&x.r!==it.r);
  const pref=P.filter(x=>ses.set.has(x.c)||S.learned[x.c]);const src=shuffle(pref.length>=3?pref:P);

/* ---------- Rafale : paquet de cartes à taper ---------- */
const unitK=c=>({j:c,t:[{c,r:ITEMS[c].r,al:ITEMS[c].al}]});
function unitW(w){const ch=[...w.j],t=[];for(let i=0;i<ch.length;){const two=ch[i]+(ch[i+1]||'');if(ITEMS[two]){t.push({c:two,r:ITEMS[two].r,al:ITEMS[two].al});i+=2;continue}const c=ch[i];
  if(c==='ー'){const v=((t[t.length-1]||{r:''}).r.match(/[aiueo]$/)||['-'])[0];t.push({c,r:v,al:['-']})}else t.push({c,r:ITEMS[c].r,al:ITEMS[c].al});i++}return{j:w.j,f:w.f,t}}
function rushPool(sc,ct){if(ct==='words')return WORDS.filter(w=>canRead(w)&&(sc==='b'||w.s===sc)).map(unitW);return Object.keys(S.learned).filter(c=>sc==='b'||ITEMS[c].s===sc).map(unitK)}
const rkey=()=>(S.rfmt||'deck')+'-'+S.rsc+'-'+S.rct+(S.rfmt==='time'?'-'+S.rdu:'');
const fmtT=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let rs=null;
function rushSetupV(){const pool=rushPool(S.rsc,S.rct),b=S.best[rkey()],deck=S.rfmt!=='time',kind=S.rct==='words'?'mots':'kana';
  const grp=(lab,k,opts)=>`<div class="og"><span>${lab}</span><div class="chips">${opts.map(([v,t])=>`<button data-act="rset" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k]||'deck')===String(v)}">${t}</button>`).join('')}</div></div>`;
  const ok=pool.length>=5;
  const talk=!ok?`Il me faut au moins 5 ${S.rct==='words'?'mots lisibles':'kana appris'} dans cette sélection. Fais encore une leçon et reviens !`
    :deck?`Ton paquet de <b>${pool.length} ${kind}</b> défile une fois. Tape la lecture, sans valider : le chrono s’arrête à la dernière carte.`
    :`Les ${kind} défilent sans fin pendant ${S.rdu} s. Tape-en le plus possible !`;
  const best=!b?'Pas encore de record pour ces réglages.':deck?`Ton record : <b>${fmtT(b.ms)}</b> pour ${b.n} cartes, ${b.acc} % de précision`:`Ton record : <b>${b.kpm} kana/min</b>, ${b.acc} % de précision`;
  return`<div class="rset">${mascot('idle',talk,64)}
  ${grp('Format','rfmt',[['deck','Paquet complet'],['time','Contre la montre']])}${grp('Écriture','rsc',[['h','Hiragana'],['k','Katakana'],['b','Les deux']])}${grp('Contenu','rct',[['kana','Kana seuls'],['words','Mots']])}${deck?'':grp('Durée','rdu',[[30,'30 s'],[60,'1 min'],[120,'2 min']])}
  <p class="rbest">${best}</p><button class="btn ac" data-act="rstart" ${ok?'':'disabled'}>Lancer la rafale</button></div>`}
function rFill(){while(rs.q.length<rs.u+10){let n,g=0;do{n=pick(rs.pool)}while(rs.q.length&&n.j===rs.q[rs.q.length-1].j&&g++<5);rs.q.push(n)}}
function startRush(){const pool=rushPool(S.rsc,S.rct);if(pool.length<5)return;const fmt=S.rfmt==='time'?'time':'deck';
  rs={fmt,pool,dur:+S.rdu,q:fmt==='deck'?shuffle(pool):[],u:0,k:0,typed:'',res:[],wrong:false,start:0,ok:0,err:0,miss:new Map(),afterN:false,tid:0,ck:'',ckU:-1};
  if(fmt==='time')rFill();view='rush';render()}
function stopRush(){if(rs&&rs.tid){clearInterval(rs.tid);rs.tid=0}}
const curTok=()=>rs.q[rs.u].t[rs.k];
function rClock(){if(!rs.start)return fmtT(rs.fmt==='time'?rs.dur*1000:0);const e=Date.now()-rs.start;return rs.fmt==='time'?fmtT(Math.max(0,rs.dur*1000-e)+999):fmtT(e)}
function rStart(){if(rs.start)return;rs.start=Date.now();rs.tid=setInterval(()=>{const el=document.getElementById('rt');if(el)el.textContent=rClock();if(rs.fmt==='time'&&Date.now()-rs.start>=rs.dur*1000)endRush()},200)}
function rPaint(){const U=rs.q[rs.u],T=U.t[rs.k],key=rs.u+'|'+rs.k+'|'+rs.wrong,cf=document.getElementById('cf');if(!cf)return;
  if(key!==rs.ck){const multi=U.t.length>1;
    cf.outerHTML=`<div class="cd front ${rs.ckU!==rs.u?'in':''} ${rs.wrong?'bad':''}" id="cf">${U.f&&rs.wrong?`<span class="mean">« ${U.f} »</span>`:''}<div class="ck ${multi?'w':''}" lang="ja">${U.t.map((t,k)=>`<i class="${k<rs.k?'dn':k===rs.k&&multi?'cur':''}">${t.c}</i>`).join('')}</div>${rs.wrong?`<span class="reveal"><span lang="ja">${T.c}</span> = ${T.r}</span>`:''}</div>`;
    rs.ck=key;rs.ckU=rs.u}
  document.getElementById('ty').textContent=rs.typed;
  const left=rs.q.length-rs.u;document.getElementById('rc').innerHTML=rs.fmt==='deck'?`${left}<small>/${rs.q.length}</small>`:`${rs.ok}<small> kana</small>`;
  if(rs.fmt==='deck'){document.getElementById('b1').hidden=left<2;document.getElementById('b2').hidden=left<3}
  document.getElementById('rh').textContent=!rs.start?'Le chrono démarre à ta première lettre.':rs.wrong?'Tape la bonne lecture pour continuer.':''}
function flash(sel,cls,ms){const e=document.querySelector(sel);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls);if(ms)setTimeout(()=>e.classList.remove(cls),ms)}
function rMiss(){const T=curTok();if(!rs.wrong){rs.err++;rs.res[rs.u]=false;rs.miss.set(T.c,T.r)}rs.wrong=true}
function rKey(k){if(!rs||view!=='rush')return;
  if(k==='back'){rs.typed=rs.typed.slice(0,-1);return rPaint()}
  if(k==='clear'){rs.typed='';return rPaint()}
  if(k==='skip'){rStart();if(!rs.wrong)sfx('bad');rMiss();rs.typed='';return rPaint()}
  if(k==='restart'){stopRush();return startRush()}
  if(!/^[a-z-]$/.test(k))return;
  flash(`.kb [data-k="${k}"]`,'hit',120);rStart();
  const T=curTok(),v=rs.typed+k,c=[T.r,...T.al];
  if(rs.afterN&&v==='n'&&!T.r.startsWith('n')){rs.afterN=false;return}
  rs.afterN=false;
  if(c.includes(v)){if(!rs.wrong)rs.ok++;rs.afterN=T.r==='n';rs.wrong=false;rs.k++;rs.typed='';
    if(rs.k>=rs.q[rs.u].t.length){sfx(rs.res[rs.u]===false?'tick':'card');if(rs.res[rs.u]!==false)rs.res[rs.u]=true;rs.u++;rs.k=0;}else sfx('tick');if(rs.k===0){
      if(rs.fmt==='time')rFill();else if(rs.u>=rs.q.length)return endRush()}
    return rPaint()}
  if(c.some(x=>x.startsWith(v))){rs.typed=v;return rPaint()}
  rMiss();rs.typed='';sfx('bad');rPaint();flash('#ty','err')}
function endRush(){if(!rs||view!=='rush')return;stopRush();const tot=rs.ok+rs.err,ms=rs.start?Date.now()-rs.start:0;
  rs.ms=rs.fmt==='deck'?ms:rs.dur*1000;rs.kpm=rs.ms?Math.round(rs.ok/(rs.ms/60000)):0;rs.acc=tot?Math.round(rs.ok/tot*100):0;
  const k=rkey(),b=S.best[k];
  if(rs.fmt==='deck'){rs.record=!!rs.ok&&(!b||b.n!==rs.q.length||rs.ms<b.ms);if(rs.record)S.best[k]={ms:rs.ms,n:rs.q.length,acc:rs.acc}}
  else{rs.record=!!rs.ok&&(!b||rs.kpm>b.kpm);if(rs.record)S.best[k]={kpm:rs.kpm,acc:rs.acc}}
  rs.prev=b;if(rs.ok)sfx('done');if(rs.ok)addXp(rs.ok);else save();view='rushres';render()}
const KB=[...'azertyuiop',...'qsdfghjklm',['restart','↻','Recommencer'],...'wxcvbn',['skip','→','Passer'],['back','←','Effacer une lettre'],['clear','«','Tout effacer']];
function rushV(){return`<div class="rz"><div class="rz-top"><button class="x" data-act="rquit" aria-label="Quitter">×</button><span class="rz-tag">${rs.fmt==='deck'?'Paquet complet':'Contre la montre · '+rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</span>${muteBtn()}${daru('idle',36,allDone())}</div>
  <div class="stage"><div class="deck"><div class="cd b2" id="b2"></div><div class="cd b1" id="b1"></div><div class="cd front" id="cf"></div></div></div>
  <p class="hintline" id="rh"></p>
  <div class="rbar"><span class="t" id="rt">${rClock()}</span><div class="typed" id="ty" aria-live="polite"></div><span class="c" id="rc"></span></div>
  <div class="kb">${KB.map(k=>typeof k==='string'?`<button data-act="rk" data-k="${k}">${k.toUpperCase()}</button>`:`<button class="fn" data-act="rk" data-k="${k[0]}" aria-label="${k[2]}" title="${k[2]}">${k[1]}</button>`).join('')}</div></div>`}
function rushResV(){const m=[...rs.miss],deck=rs.fmt==='deck';
  const talk=!rs.ok?'Le chrono n’a pas vraiment tourné… On en refait une ?'
    :rs.record?`Nouveau record ! ${rs.prev?(deck?`Avant : ${fmtT(rs.prev.ms)}.`:`Avant : ${rs.prev.kpm} kana/min.`):'Premier score enregistré.'}`
    :rs.kpm<15?'Bon début : la vitesse vient avec les révisions.':rs.kpm<30?'Ça commence à filer, continue !':rs.kpm<50?'Très rapide, tu lis presque sans réfléchir.':'Vitesse de ninja. Daru est impressionné.';
  return top()+`<section class="band"><div class="wrap narrow res"><p class="lead">Rafale · ${deck?'paquet de '+rs.q.length+' cartes':rs.dur+' s'} · ${S.rct==='words'?'mots':'kana'}</p>
  <div class="big-n">${deck?fmtT(rs.ms):rs.kpm}</div><p class="lead" style="margin-top:-4px">${deck?'pour finir le paquet':'kana par minute'}</p>
  <div class="rfigs"><div class="fig1"><b>${deck?rs.kpm:rs.ok}</b><span>${deck?'kana/min':'kana justes'}</span></div><div class="fig1"><b>${rs.acc} %</b><span>précision</span></div><div class="fig1"><b>${rs.err}</b><span>erreurs</span></div></div>
  ${m.length?`<h2 style="margin-top:14px">À retravailler</h2><div class="mrow">${m.map(([c,r])=>`<button class="mk" data-act="say" data-t="${c}"><span lang="ja">${c}</span><small>${r}</small></button>`).join('')}</div>`:''}
  ${mascot(rs.record&&rs.ok?'happy':'idle',talk,70)}
  <div class="acts"><button class="btn ac" data-act="rstart">Rejouer</button><button class="btn gh" data-act="home">Retour</button></div></div></section>`}

function render(){app.innerHTML={home:homeV,cards:cardsV,quiz:quizV,res:resV,set:setV,rush:rushV,rushres:rushResV,brush:brushV,brushres:brushResV}[view]();
  if(!KS&&!ksP&&(view==='cards'||(view==='home'&&S.page==='brush')))loadKS().then(()=>{if(view==='cards'||view==='home')render()}).catch(()=>{});
  const pid=['cp','qp','bp'].find(i=>document.getElementById(i));
  if(!pid)PAD=null;else{const P=mountPad(pid),mo=(c,ok)=>P.over(modelSVG(c,{cls:ok?'okm':'badm',speed:.45}));
    if(pid==='qp'&&ses&&ses.ans){P.locked=true;P.fade=true;P.redraw();mo(cur().c,ses.ans.ok)}
    if(pid==='cp'&&ses&&ses.tdone)mo(LES[ses.id].items[ses.ci],ses.tok);
    if(pid==='bp'&&bs){P.onStroke=()=>{if(!bs.start){bs.start=Date.now();bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}};if(bs.state==='done')mo(bs.q[bs.u],bs.r.ok)}}
  if(view==='rush')rPaint();
  if(view!==lastView){window.scrollTo(0,0);lastView=view}
  if(view==='cards')say(LES[ses.id].items[ses.ci]);
  if(view==='quiz'){const Q=cur();if(ses.ans){const b=document.getElementById('nb');b&&b.focus({preventScroll:true})}else if(Q.type==='type'){const i=document.getElementById('ti');i&&i.focus({preventScroll:true})}else if(Q.type==='ear')say(Q.c)}}

/* ---------- événements ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
  if(a!=='reset')armed=false;if(a!=='delacc')armedDel=false;
  switch(a){
    case'lesson':startLesson(id);break;case'test':startTest(id);break;case'review':startReview(false);break;case'practice':startReview(true);break;
    case'say':say(b.dataset.t);break;case'tab':S.tab=id;save();render();break;case'page':S.page=id;save();render();break;
    case'cnext':ses.ci++;ses.tr=false;ses.tdone=false;ses.tmsg='';render();break;case'prev':ses.ci--;ses.tr=false;ses.tdone=false;ses.tmsg='';render();break;case'go':initQuiz(lessonQueue());render();break;
    case'opt':answer(+b.dataset.i);break;case'next':next();break;
    case'rset':{const k=b.dataset.k;S[k]=['rdu','bl','bn'].includes(k)?+b.dataset.v:b.dataset.v;save();render();break}
    case'rstart':startRush();break;
    case'replay':{const tm=document.getElementById('tm');if(tm)tm.innerHTML=modelSVG(LES[ses.id].items[ses.ci]);break}
    case'ctrace':ses.tr=true;ses.tmsg='';ses.tdone=false;render();break;
    case'ccheck':{const c=LES[ses.id].items[ses.ci],st=strokesOf(PAD);if(!st.length)break;const r=judgeDraw(st,c);ses.tok=r.ok;ses.tmsg=(r.ok?'Bien tracé ! ':'')+r.tip;ses.tdone=true;PAD.locked=true;PAD.fade=true;sfx(r.ok?'ok':'bad');render();break}
    case'cagain':ses.tdone=false;ses.tmsg='';PAD&&PAD.reset();render();break;
    case'pundo':PAD&&PAD.undo();break;case'pclear':PAD&&PAD.clear();break;
    case'qcheck':{const Q=cur(),st=strokesOf(PAD);if(!st.length||ses.ans)break;const r=judgeDraw(st,Q.c);PAD.locked=true;PAD.fade=true;ses.prevBox=ses.prevBox||{};if(S.learned[Q.c]&&ses.prevBox[Q.c]==null)ses.prevBox[Q.c]=S.learned[Q.c].box;settle(r.ok,{tip:r.tip,draw:true});break}
    case'qself':{const Q=cur(),A=ses.ans;if(!A||A.ok||A.self)break;A.self=true;A.ok=true;A.msg='Compté juste.';A.tip='';
      if(!Q.retry){ses.ok++;ses.xp+=2;ses.miss.delete(Q.c);if(ses.graded.has(Q.c)&&S.learned[Q.c]){S.learned[Q.c].box=ses.prevBox[Q.c]||1;grade(Q.c,true);save()}}
      const lq=ses.queue[ses.queue.length-1];if(lq&&lq.retry&&lq.c===Q.c)ses.queue.pop();sfx('ok');render();break}
    case'bstart':startBrush();break;
    case'bhint':{if(!bs||bs.state==='done')break;const base=BASE_AID[bs.lvl];bs.h=Math.min(3,Math.max(base,bs.h)+1);aidAnim=bs.h===3;sfx('tick');render();break}
    case'qhint':{const Q=cur();if(!Q||ses.ans)break;Q.h=Math.min(3,(Q.h||0)+1);aidAnim=Q.h===3;sfx('tick');render();break}case'bcheck':bCheck();break;case'bnext':bNext();break;
    case'bretry':bs.state='draw';bs.r=null;PAD&&PAD.reset();render();break;
    case'bskip':{if(bs.state==='done')break;if(!bs.start){bs.start=Date.now();bs.tid=setInterval(()=>{const e=document.getElementById('bt');if(e)e.textContent=bClock()},500)}
      bs.r={ok:false,tip:'Voici comment le tracer : observe l’ordre des traits.',self:true};bs.state='done';if(bs.res[bs.u]==null){bs.res[bs.u]=false;bs.err++;bs.miss.add(bs.q[bs.u])}if(PAD){PAD.locked=true;PAD.fade=true}sfx('bad');render();break}
    case'bself':{if(bs.res[bs.u]===false){bs.res[bs.u]=true;bs.ok++;bs.err--;bs.miss.delete(bs.q[bs.u])}bs.r.ok=true;bs.r.self=true;bs.r.tip='Compté juste.';sfx('ok');render();break}
    case'bquit':stopBrush();bs=null;PAD=null;view='home';render();break;case'lreset':cloud.step='';cloud.msg='';render();break;case'atab':cloud.tab=id;cloud.msg='';cloud.step='';render();break;case'pwopen':cloud.pwOpen=true;cloud.msg='';render();break;case'logout':cloud.sb&&cloud.sb.auth.signOut();cloud.msg='';break;case'delacc':if(!armedDel){armedDel=true;render()}else{armedDel=false;sbDelete()}break;case'mute':S.snd=S.snd===false;save();if(S.snd)sfx('ok');{const n=document.createElement('div');n.innerHTML=muteBtn();b.replaceWith(n.firstChild)}break;case'rk':rKey(b.dataset.k);break;
    case'rquit':stopRush();rs=null;view='home';render();break;
    case'quit':case'home':stopRush();stopBrush();ses=null;view='home';render();break;case'settings':view='set';render();break;
    case'tog':S[b.dataset.k]=b.checked;save();break;
    case'copy':{const t=document.getElementById('exp');try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Copié'},()=>t.select())}catch(err){t.select()}break}
    case'reset':if(!armed){armed=true;render()}else{armed=false;replaceState(fresh());homeTip=null;save();view='home';render()}break;
  }});
app.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login')return sbLogin(e.target,e.submitter&&e.submitter.dataset.sub);if(e.target.id==='setpw')return sbSetPw(e.target);if(e.target.id==='tf')answerTyped(document.getElementById('ti').value);
  if(e.target.id==='imp'){const m=document.getElementById('impm');try{const v=JSON.parse(document.getElementById('impt').value);if(!v||typeof v.learned!=='object')throw 0;replaceState(Object.assign(fresh(),v));homeTip=null;save();render();document.getElementById('impm').textContent='Progression importée.'}catch(err){m.textContent='Ce code n’est pas valide.'}}});
document.addEventListener('keydown',e=>{if(view==='brush'&&bs){if(e.target.tagName==='BUTTON')return;if(e.key==='Enter'){e.preventDefault();bs.state==='done'?bNext():bCheck()}else if(e.key==='Backspace'){e.preventDefault();PAD&&PAD.undo()}else if(e.key==='Escape')PAD&&PAD.clear();return}if(view==='rush'){if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;const m=/^[a-zA-Z-]$/.test(k)?k.toLowerCase():k==='Backspace'?'back':k==='Escape'?'clear':k==='ArrowRight'?'skip':null;if(m){e.preventDefault();rKey(m)}return}if(view!=='quiz'||!ses)return;if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT')return;
  if(ses.ans){if(e.key==='Enter'){e.preventDefault();next()}return}if(cur().type!=='type'&&cur().type!=='draw'&&/^[1-4]$/.test(e.key))answer(+e.key-1)});
render();cloudInit();loadKS().then(()=>{if(view==='home'||view==='cards')render()}).catch(()=>{});
</script></body></html>
