name: Déploiement

# Chaque push sur main : tests complets, construction de dist/ (version du cache calculée), publication sur GitHub Pages.
# Si un test échoue, rien n'est publié : le site reste sur la version précédente.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit
      - run: npm test

  publication:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construction du site
        run: node scripts/build.mjs dist | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploiement
        uses: actions/deploy-pages@v4
